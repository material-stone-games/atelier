<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Atelier가 이사했어요</title>
<script>
  // Atelier moved. Keep the path after /atelier, the query and the hash.
  var target = "https://material-stone.github.io/atelier";
  location.replace(target + location.pathname.replace(/^\/atelier/, "") + location.search + location.hash);
</script>
</head>
<body>
<p>Atelier가 새 주소로 이사했어요. <a href="https://material-stone.github.io/atelier/">새 주소로 가기</a></p>
</body>
</html>
