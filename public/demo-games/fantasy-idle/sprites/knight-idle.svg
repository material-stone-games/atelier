<svg xmlns="http://www.w3.org/2000/svg"
     width="64" height="96"
     viewBox="0 0 64 96"
     shape-rendering="crispEdges"
     style="image-rendering: pixelated;">

  <!-- === KNIGHT WARRIOR SPRITE ===
       16x24 pixel grid, 4px per pixel
       Style: retro 8-bit pixel art
       Colors: silver-blue armor, red plume, gold trim, dark boots -->

  <!-- PLUME (red) -->
  <rect x="20" y="0" width="4" height="4" fill="#AA1800"/>
  <rect x="24" y="0" width="12" height="4" fill="#FF4422"/>
  <rect x="36" y="0" width="4" height="4" fill="#AA1800"/>
  <rect x="16" y="4" width="4" height="4" fill="#AA1800"/>
  <rect x="20" y="4" width="20" height="4" fill="#FF4422"/>
  <rect x="40" y="4" width="4" height="4" fill="#AA1800"/>

  <!-- HELMET (silver-blue) -->
  <rect x="12" y="8" width="36" height="4" fill="#C8D8E8"/>
  <rect x="16" y="8" width="28" height="2" fill="#E8F4FF"/>
  <rect x="8" y="12" width="44" height="4" fill="#C8D8E8"/>

  <!-- VISOR (upper - dark) -->
  <rect x="8" y="16" width="8" height="4" fill="#C8D8E8"/>
  <rect x="16" y="16" width="28" height="4" fill="#2C3A4A"/>
  <rect x="44" y="16" width="8" height="4" fill="#C8D8E8"/>

  <!-- FACE SLIT (eyes visible) -->
  <rect x="8" y="20" width="8" height="4" fill="#C8D8E8"/>
  <rect x="16" y="20" width="4" height="4" fill="#2C3A4A"/>
  <rect x="20" y="20" width="4" height="4" fill="#FFCC88"/>
  <rect x="24" y="20" width="4" height="4" fill="#3A2210"/>
  <rect x="28" y="20" width="4" height="4" fill="#E8A060"/>
  <rect x="32" y="20" width="4" height="4" fill="#3A2210"/>
  <rect x="36" y="20" width="4" height="4" fill="#FFCC88"/>
  <rect x="40" y="20" width="4" height="4" fill="#2C3A4A"/>
  <rect x="44" y="20" width="8" height="4" fill="#C8D8E8"/>

  <!-- VISOR (lower - dark) -->
  <rect x="8" y="24" width="8" height="4" fill="#C8D8E8"/>
  <rect x="16" y="24" width="28" height="4" fill="#2C3A4A"/>
  <rect x="44" y="24" width="8" height="4" fill="#C8D8E8"/>

  <!-- CHIN GUARD -->
  <rect x="8" y="28" width="44" height="4" fill="#C8D8E8"/>
  <rect x="12" y="28" width="36" height="2" fill="#DDE8F2"/>

  <!-- GORGET (neck armor) -->
  <rect x="12" y="32" width="36" height="4" fill="#8BAFC8"/>

  <!-- PAULDRONS (shoulder guards) -->
  <rect x="4" y="36" width="16" height="4" fill="#8BAFC8"/>
  <rect x="20" y="36" width="4" height="4" fill="#D4A017"/>
  <rect x="24" y="36" width="8" height="4" fill="#8BAFC8"/>
  <rect x="32" y="36" width="4" height="4" fill="#D4A017"/>
  <rect x="36" y="36" width="16" height="4" fill="#8BAFC8"/>
  <!-- shoulder highlight -->
  <rect x="4" y="36" width="16" height="2" fill="#A8C8E0"/>
  <rect x="36" y="36" width="16" height="2" fill="#A8C8E0"/>

  <!-- CHEST PLATE -->
  <rect x="0" y="40" width="56" height="4" fill="#8BAFC8"/>
  <rect x="4" y="40" width="48" height="2" fill="#A8C8E0"/>

  <!-- GOLD BELT -->
  <rect x="0" y="44" width="20" height="4" fill="#8BAFC8"/>
  <rect x="20" y="44" width="20" height="4" fill="#D4A017"/>
  <rect x="40" y="44" width="16" height="4" fill="#8BAFC8"/>
  <!-- belt highlight -->
  <rect x="20" y="44" width="20" height="2" fill="#E8C040"/>

  <!-- TORSO -->
  <rect x="0" y="48" width="56" height="4" fill="#8BAFC8"/>

  <!-- LOWER TORSO -->
  <rect x="4" y="52" width="48" height="4" fill="#8BAFC8"/>

  <!-- TASSET (hip armor plates) -->
  <rect x="4" y="56" width="4" height="4" fill="#4A6A88"/>
  <rect x="8" y="56" width="4" height="4" fill="#8BAFC8"/>
  <rect x="12" y="56" width="4" height="4" fill="#4A6A88"/>
  <rect x="16" y="56" width="4" height="4" fill="#8BAFC8"/>
  <rect x="20" y="56" width="4" height="4" fill="#4A6A88"/>
  <rect x="32" y="56" width="4" height="4" fill="#4A6A88"/>
  <rect x="36" y="56" width="4" height="4" fill="#8BAFC8"/>
  <rect x="40" y="56" width="4" height="4" fill="#4A6A88"/>
  <rect x="44" y="56" width="4" height="4" fill="#8BAFC8"/>
  <rect x="48" y="56" width="4" height="4" fill="#4A6A88"/>

  <!-- UPPER LEGS (cuisses) -->
  <rect x="8" y="60" width="12" height="8" fill="#8BAFC8"/>
  <rect x="36" y="60" width="12" height="8" fill="#8BAFC8"/>
  <!-- leg highlight -->
  <rect x="12" y="60" width="4" height="8" fill="#A0C0D8"/>
  <rect x="40" y="60" width="4" height="8" fill="#A0C0D8"/>

  <!-- KNEES (poleyns) -->
  <rect x="8" y="68" width="4" height="4" fill="#4A6A88"/>
  <rect x="12" y="68" width="4" height="4" fill="#A8CCE0"/>
  <rect x="16" y="68" width="4" height="4" fill="#4A6A88"/>
  <rect x="36" y="68" width="4" height="4" fill="#4A6A88"/>
  <rect x="40" y="68" width="4" height="4" fill="#A8CCE0"/>
  <rect x="44" y="68" width="4" height="4" fill="#4A6A88"/>

  <!-- LOWER LEGS (greaves) -->
  <rect x="8" y="72" width="12" height="8" fill="#8BAFC8"/>
  <rect x="36" y="72" width="12" height="8" fill="#8BAFC8"/>
  <!-- greave highlight -->
  <rect x="12" y="72" width="4" height="8" fill="#A0C0D8"/>
  <rect x="40" y="72" width="4" height="8" fill="#A0C0D8"/>

  <!-- BOOTS (sabatons) -->
  <rect x="8" y="80" width="12" height="8" fill="#1A1A2E"/>
  <rect x="36" y="80" width="12" height="8" fill="#1A1A2E"/>
  <!-- boot highlight -->
  <rect x="8" y="80" width="4" height="2" fill="#3A3A5E"/>
  <rect x="36" y="80" width="4" height="2" fill="#3A3A5E"/>

  <!-- BOOT BASE (wider sole) -->
  <rect x="4" y="88" width="16" height="8" fill="#1A1A2E"/>
  <rect x="36" y="88" width="16" height="8" fill="#1A1A2E"/>
  <!-- sole edge -->
  <rect x="4" y="92" width="16" height="4" fill="#0A0A1A"/>
  <rect x="36" y="92" width="16" height="4" fill="#0A0A1A"/>

</svg>
