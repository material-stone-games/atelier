<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Break</title>
<style>
  :root { --bg: #101418; --panel: #171c21; --line: rgba(232,231,223,.13); --cream: #e8e7df; --muted: #899197; --orange: #ff7144; --gold: #ffd27a; --s: 1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--cream); font-family: ui-monospace, "DM Mono", Consolas, monospace; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  .wrap { height: 100%; display: grid; place-items: center; padding: 10px; }
  .stage { position: relative; }
  canvas { display: block; border: 1px solid var(--line); background: var(--panel); }
  .overlay { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 8px; padding: 18px; background: radial-gradient(ellipse at 50% 60%, rgba(255,113,68,.10), transparent 60%), rgba(16,20,24,.78); cursor: pointer; }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-size: 26px; animation: glow 2.4s ease-in-out infinite; }
  .overlay p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.7; }
  .overlay .accent { color: var(--orange); animation: blink 1.4s ease-in-out infinite; }
  .overlay .newbest { color: var(--gold); font-size: 12px; letter-spacing: .2em; animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
  .overlay .newbest[hidden] { display: none; }
  @keyframes glow { 0%, 100% { text-shadow: 0 0 8px rgba(255,113,68,.25); } 50% { text-shadow: 0 0 18px rgba(255,113,68,.7), 0 0 2px #ffd27a; } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  #mute { position: absolute; top: 0; right: 0; z-index: 3; width: calc(36px * var(--s)); height: calc(36px * var(--s)); display: grid; place-items: center; padding: 0; border: 0; background: none; color: var(--muted); cursor: pointer; }
  #mute:hover { color: var(--cream); }
  #mute svg { width: 50%; height: 50%; }
  #mute .off { display: none; }
  #mute.muted .on { display: none; }
  #mute.muted .off { display: inline; }

  @media (prefers-reduced-motion: reduce) {
    .overlay h1, .overlay .accent, .overlay .newbest { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="board"></canvas>
    <button id="mute" type="button" aria-label="소리 켜기/끄기 (M)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/><path class="on" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="off" d="M16 9l5 6M21 9l-5 6"/></svg>
    </button>
    <div class="overlay" id="overlay">
      <h1 id="title">Ember Break</h1>
      <p class="newbest" id="newbest" hidden>NEW BEST</p>
      <p id="message">←/→ 또는 마우스·터치로 받침 이동 · SPACE/클릭으로 발사<br>회색 돌 1번 · 금 간 돌 2번 · 불꽃 돌은 주변 돌까지 터뜨려요<br>받침에 닿기 전까지 연속으로 깨면 콤보 보너스</p>
      <p class="accent">SPACE 또는 터치로 시작</p>
    </div>
  </div>
</div>
<script>
  const W = 400, H = 560, COLS = 8, BRICK_H = 18, TOP = 64, GAP = 4, CEIL = 36;
  const BRICK_W = (W - 24 - GAP * (COLS - 1)) / COLS;
  const COMBO_CALLOUTS = { 5: "NICE", 10: "GREAT", 15: "BLAZING", 25: "INFERNO" };
  const MAX_PARTICLES = 700;

  const $ = (id) => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const canvas = $("board");
  const ctx = canvas.getContext("2d");
  const overlay = $("overlay");
  const muteBtn = $("mute");
  const ui = { title: $("title"), message: $("message"), newbest: $("newbest") };
  const keys = new Set();

  /* ---------- 사운드: 전부 Web Audio로 합성 ---------- */
  const sfx = (() => {
    const MUTE_KEY = "ember-break-muted";
    let ac = null, out = null, wet = null, noiseBuf = null, muted = false;
    try { muted = localStorage.getItem(MUTE_KEY) === "1"; } catch { /* storage unavailable */ }

    function init() {
      if (ac) { if (ac.state === "suspended") ac.resume(); return; }
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      ac = new Ctx();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 5;
      comp.attack.value = 0.002; comp.release.value = 0.12;
      out = ac.createGain();
      out.gain.value = muted ? 0 : 0.8;
      out.connect(comp); comp.connect(ac.destination);
      // 짧은 피드백 딜레이: 동굴 같은 잔향
      wet = ac.createGain();
      const delay = ac.createDelay(1), fb = ac.createGain(), damp = ac.createBiquadFilter();
      delay.delayTime.value = 0.11; fb.gain.value = 0.32;
      damp.type = "lowpass"; damp.frequency.value = 2000;
      wet.connect(delay); delay.connect(damp); damp.connect(fb); fb.connect(delay); damp.connect(out);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i += 1) d[i] = Math.random() * 2 - 1;
    }

    function env(gain, t, attack, peak, dur) {
      gain.setValueAtTime(0.0001, t);
      gain.exponentialRampToValueAtTime(peak, t + attack);
      gain.exponentialRampToValueAtTime(0.0001, t + dur);
    }

    function connect(g, send) {
      g.connect(out);
      if (!send) return;
      const s = ac.createGain();
      s.gain.value = send;
      g.connect(s); s.connect(wet);
    }

    // 주파수 경로: [[시간, 주파수], ...] 를 지수 램프로 잇는다
    function tone(type, path, dur, vol, { at = 0, attack = 0.004, send = 0 } = {}) {
      if (!ac) return;
      const t = ac.currentTime + at;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(path[0][1], t);
      for (let i = 1; i < path.length; i += 1) o.frequency.exponentialRampToValueAtTime(path[i][1], t + path[i][0]);
      env(g.gain, t, attack, vol, dur);
      o.connect(g); connect(g, send);
      o.start(t); o.stop(t + dur + 0.05);
    }

    function noise(dur, vol, { at = 0, type = "bandpass", f0 = 1000, f1 = 0, q = 1, attack = 0.002, send = 0 } = {}) {
      if (!ac) return;
      const t = ac.currentTime + at;
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noiseBuf;
      f.type = type; f.Q.value = q;
      f.frequency.setValueAtTime(f0, t);
      if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      env(g.gain, t, attack, vol, dur);
      s.connect(f); f.connect(g); connect(g, send);
      s.start(t, Math.random() * 0.4); s.stop(t + dur + 0.05);
    }

    const note = (n) => 440 * Math.pow(2, (n - 69) / 12);
    // 콤보 사다리는 펜타토닉: 어디서 끊겨도 듣기 좋다
    const PENTA = [0, 2, 4, 7, 9];
    const step = (i) => PENTA[i % 5] + Math.floor(i / 5) * 12;
    const ladder = (combo) => note(69 + step(Math.min(combo - 1, 19)));
    const gate = {};
    // 같은 소리가 한 프레임에 겹쳐 쌓이지 않게
    const ok = (name, gap) => {
      if (!ac) return false;
      if (ac.currentTime - (gate[name] || 0) < gap) return false;
      gate[name] = ac.currentTime;
      return true;
    };

    return {
      init,
      get muted() { return muted; },
      toggleMute() {
        muted = !muted;
        try { localStorage.setItem(MUTE_KEY, muted ? "1" : "0"); } catch { /* storage unavailable */ }
        if (out) out.gain.setTargetAtTime(muted ? 0 : 0.8, ac.currentTime, 0.02);
        return muted;
      },
      start() {
        tone("triangle", [[0, note(64)]], 0.12, 0.12, { send: 0.2 });
        tone("triangle", [[0, note(71)]], 0.25, 0.12, { at: 0.08, send: 0.3 });
        noise(0.3, 0.06, { type: "bandpass", f0: 600, f1: 3000, q: 0.8, attack: 0.08 });
      },
      // 발사: 바람 가르는 휙 + 상승음
      launch() {
        noise(0.22, 0.16, { type: "bandpass", f0: 500, f1: 3200, q: 1.4, attack: 0.03 });
        tone("sine", [[0, 300], [0.15, 900]], 0.16, 0.08);
      },
      // 받침: 묵직한 통 + 튕기는 음. 가장자리일수록 높다
      paddle(offset) {
        const p = 1 + Math.abs(offset) * 0.35;
        noise(0.03, 0.22, { type: "highpass", f0: 2600 });
        tone("triangle", [[0, 240], [0.08, 110]], 0.1, 0.28, { attack: 0.001 });
        tone("square", [[0, 330 * p], [0.05, 520 * p]], 0.06, 0.05, { attack: 0.001 });
      },
      wall(ceiling) {
        if (!ok("wall", 0.03)) return;
        const f = (ceiling ? 1500 : 1900) * rand(0.95, 1.05);
        tone("sine", [[0, f], [0.04, f * 0.7]], 0.05, 0.06, { attack: 0.001 });
        noise(0.02, 0.06, { type: "highpass", f0: 4000 });
      },
      // 금 간 돌 첫 타격: 날카롭게 쩍
      crack() {
        if (!ok("crack", 0.02)) return;
        noise(0.05, 0.3, { type: "highpass", f0: 3800, q: 0.8 });
        tone("square", [[0, 1100], [0.06, 260]], 0.07, 0.07, { attack: 0.001 });
        tone("triangle", [[0, 520], [0.08, 200]], 0.09, 0.14, { attack: 0.001 });
      },
      // 돌 파괴: 와삭 + 쿵 + 콤보 사다리 음
      smash(kind, combo) {
        if (!ok("smash", 0.025)) return;
        const p = rand(0.92, 1.08);
        noise(0.12, 0.3, { type: "bandpass", f0: 2200 * p, f1: 500, q: 0.9 });
        tone("triangle", [[0, 360 * p], [0.1, 90]], 0.12, 0.26, { attack: 0.001 });
        if (kind === "cracked") tone("sine", [[0, 2100 * p], [0.15, 1700 * p]], 0.16, 0.05, { send: 0.3 });
        const f = ladder(combo);
        tone("sine", [[0, f]], 0.22, 0.09, { at: 0.005, send: 0.25 });
        tone("triangle", [[0, f * 2]], 0.08, 0.03, { at: 0.005 });
      },
      // 불꽃 돌 폭발: 저역 쿵 + 불티 타닥
      boom(chain) {
        if (!ok("boom", 0.04)) return;
        const p = rand(0.9, 1.1) * (1 + Math.min(chain, 6) * 0.04);
        noise(0.55, 0.45, { type: "lowpass", f0: 1600 * p, f1: 70, q: 0.7, send: 0.35 });
        tone("sine", [[0, 140 * p], [0.35, 38]], 0.42, 0.5, { attack: 0.002 });
        tone("sawtooth", [[0, 90 * p], [0.2, 40]], 0.22, 0.08, { attack: 0.002 });
        for (let i = 0; i < 5; i += 1) noise(0.02, 0.14, { at: 0.04 + i * rand(0.025, 0.07), type: "highpass", f0: rand(2500, 5000) });
      },
      callout(level) {
        const base = 64 + level * 2;
        [0, 4, 7, 12].forEach((n, i) => tone("triangle", [[0, note(base + n)]], 0.3, 0.08, { at: i * 0.045, send: 0.35 }));
        noise(0.4, 0.05, { at: 0.05, type: "highpass", f0: 6000, attack: 0.05 });
      },
      // 마지막 돌: 공기가 멈추는 듯한 저음 스웰
      lastBrick() {
        tone("sine", [[0, 60], [0.6, 45]], 0.8, 0.3, { attack: 0.02 });
        noise(0.9, 0.08, { type: "bandpass", f0: 300, f1: 2400, q: 1.2, attack: 0.3, send: 0.4 });
      },
      clear() {
        [0, 2, 4, 7, 9, 12, 16, 19].forEach((n, i) => tone("triangle", [[0, note(67 + n)]], 0.35, 0.09, { at: 0.1 + i * 0.07, send: 0.4 }));
        tone("sine", [[0, note(55)]], 1.2, 0.1, { at: 0.1, attack: 0.05, send: 0.3 });
        noise(1, 0.05, { at: 0.5, type: "highpass", f0: 7000, attack: 0.1 });
      },
      // 공을 놓침: 꺼지는 하강음
      lose() {
        tone("sawtooth", [[0, 520], [0.55, 70]], 0.6, 0.1, { attack: 0.005, send: 0.25 });
        tone("sine", [[0, 160], [0.4, 40]], 0.45, 0.35, { attack: 0.002 });
        noise(0.45, 0.2, { type: "lowpass", f0: 900, f1: 80, q: 0.6 });
      },
      over() {
        [71, 67, 64, 59].forEach((n, i) => tone("triangle", [[0, note(n)], [0.4, note(n) * 0.97]], 0.45, 0.11, { at: i * 0.18, send: 0.35 }));
        tone("sine", [[0, note(40)]], 1.4, 0.16, { at: 0.55, attack: 0.05 });
      },
      best() {
        [0, 4, 7, 11, 14].forEach((n, i) => tone("sine", [[0, note(79 + n)]], 0.25, 0.05, { at: 0.9 + i * 0.06, send: 0.5 }));
      },
    };
  })();

  /* ---------- 게임 상태 ---------- */
  let scale = 1, paddle, ball, bricks, score, lives, level, state = "ready", last = 0, pointerX = null;
  let best = readBest(), runBest = best;
  let combo = 0, maxCombo = 0, clearTimer = 0, deathTimer = 0, chain = [];

  /* ---------- 연출 상태 ---------- */
  let particles = [], debris = [], rings = [], texts = [], trail = [], embers = [];
  let shake = 0, freeze = 0, timeScale = 1, slowTimer = 0, heat = 0, clock = 0;
  let flash = { a: 0, color: "#fff" }, banner = null, ceilFlash = 0, lifeFlash = 0;
  let shownScore = 0, scorePunch = 0, comboPunch = 0;

  function readBest() { try { return Number(localStorage.getItem("ember-break-best")) || 0; } catch { return 0; } }
  function saveBest() { try { localStorage.setItem("ember-break-best", String(best)); } catch { /* storage unavailable */ } }

  function fit() {
    scale = Math.max(0.4, Math.min((innerWidth - 20) / W, (innerHeight - 20) / H));
    const ratio = devicePixelRatio || 1;
    canvas.style.width = `${W * scale}px`;
    canvas.style.height = `${H * scale}px`;
    canvas.width = W * scale * ratio;
    canvas.height = H * scale * ratio;
    ctx.setTransform(scale * ratio, 0, 0, scale * ratio, 0, 0);
    document.documentElement.style.setProperty("--s", scale);
  }

  // 빛 번짐 스프라이트: 색별로 한 번만 그려 두고 'lighter'로 덧칠한다
  const glowCache = new Map();
  function glow(color) {
    let c = glowCache.get(color);
    if (c) return c;
    c = document.createElement("canvas");
    c.width = c.height = 64;
    const g = c.getContext("2d");
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, color); grad.addColorStop(0.35, color + "88"); grad.addColorStop(1, color + "00");
    g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
    glowCache.set(color, c);
    return c;
  }
  function drawGlow(color, x, y, r, alpha = 1) {
    ctx.globalAlpha = alpha;
    ctx.drawImage(glow(color), x - r, y - r, r * 2, r * 2);
  }

  // Each level is a different silhouette; deeper levels add more cracked and fire stones.
  const PATTERNS = [
    (r, c) => r < 5,
    (r, c) => Math.abs(c - 3.5) <= r * 0.8 + 0.5 && r < 7,
    (r, c) => (r + c) % 2 === 0 && r < 8,
    (r, c) => r < 8 && !(r >= 2 && r <= 5 && c >= 2 && c <= 5),
    (r, c) => r < 8 && (c % 3 !== 1 || r % 3 === 0),
  ];

  function buildLevel() {
    const shape = PATTERNS[(level - 1) % PATTERNS.length];
    const toughness = Math.min(0.45, 0.12 + level * 0.06);
    bricks = [];
    chain = [];
    for (let r = 0; r < 9; r += 1) for (let c = 0; c < COLS; c += 1) {
      if (!shape(r, c)) continue;
      const roll = Math.random();
      const kind = roll < 0.08 ? "fire" : roll < 0.08 + toughness ? "cracked" : "stone";
      // spawn < 0 이면 아직 떨어지기 전: 위에서부터 물결치듯 내려앉는다
      bricks.push({ r, c, x: 12 + c * (BRICK_W + GAP), y: TOP + r * (BRICK_H + GAP), kind, hp: kind === "cracked" ? 2 : 1, spawn: -(r * 0.05 + Math.abs(c - 3.5) * 0.03), hitFlash: 0, wob: 0, seed: Math.random() * 10 });
    }
  }

  function resetBall() {
    ball = { x: paddle.x, y: paddle.y - 10, r: 6, vx: 0, vy: 0, stuck: true, lost: false, speed: 300 + level * 22, squash: 0 };
    trail = [];
    combo = 0;
  }

  function reset() {
    paddle = { x: W / 2, y: H - 34, w: 74, h: 10, squash: 0, dip: 0, glow: 0, vel: 0 };
    score = 0; lives = 3; level = 1; maxCombo = 0; shownScore = 0;
    particles = []; debris = []; rings = []; texts = []; banner = null;
    clearTimer = 0; deathTimer = 0; timeScale = 1; slowTimer = 0; freeze = 0;
    buildLevel();
    resetBall();
  }

  function launch() {
    if (!ball.stuck || ball.lost || clearTimer > 0) return;
    sfx.init();
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.6;
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    ball.stuck = false;
    ball.squash = 1;
    paddle.squash = 0.6; paddle.dip = 1;
    sparks(ball.x, ball.y + 4, -Math.PI / 2, 1.4, "#ffd27a", 10, 220);
    rings.push({ x: ball.x, y: ball.y, r: 4, max: 30, life: 0.3, t: 0.3, color: "#ffd27a", w: 2 });
    sfx.launch();
  }

  /* ---------- 연출 도우미 ---------- */
  function addShake(amount) { shake = Math.min(14, shake + amount * (reduceMotion ? 0.25 : 1)); }
  function hitStop(sec) { if (!reduceMotion) freeze = Math.max(freeze, sec); }
  function slowMo(scaleTo, sec) { timeScale = Math.min(timeScale, scaleTo); slowTimer = Math.max(slowTimer, sec); }
  function doFlash(color, a) { flash.color = color; flash.a = Math.max(flash.a, a * (reduceMotion ? 0.4 : 1)); }
  function popText(x, y, text, color, size = 12, life = 0.8) { texts.push({ x, y, text, color, size, life, t: life }); }

  function spawn(p) { if (particles.length < MAX_PARTICLES) particles.push(p); }

  // 방향성 있는 불티: 각도 a 주위로 spread 만큼 퍼진다
  function sparks(x, y, a, spread, color, count, speed = 200) {
    for (let i = 0; i < count; i += 1) {
      const ang = a + (Math.random() - 0.5) * spread, s = speed * rand(0.4, 1.2);
      spawn({ x, y, vx: Math.cos(ang) * s, vy: Math.sin(ang) * s, life: rand(0.2, 0.5), t: 0.5, color, g: 380, drag: 2.5, kind: "spark", size: rand(1, 2) });
    }
  }

  function burst(x, y, color, count, speed = 160, life = 0.6) {
    for (let i = 0; i < count; i += 1) {
      const a = Math.random() * Math.PI * 2, s = speed * rand(0.25, 1);
      spawn({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(life * 0.5, life), t: life, color, g: 120, drag: 2, kind: "dot", size: rand(1.5, 3) });
    }
  }

  // 돌 조각: 중력으로 떨어지며 회전하는 직사각형 파편
  function shatter(brick, dirX, dirY, n) {
    const color = brickColor(brick);
    const cols = 4, rows = 2, pw = BRICK_W / cols, ph = BRICK_H / rows;
    let made = 0;
    for (let i = 0; i < cols && made < n; i += 1) for (let j = 0; j < rows && made < n; j += 1) {
      const x = brick.x + pw * (i + 0.5), y = brick.y + ph * (j + 0.5);
      const ox = (x - (brick.x + BRICK_W / 2)) * 4, oy = (y - (brick.y + BRICK_H / 2)) * 4;
      debris.push({ x, y, vx: ox + dirX * rand(40, 160) + rand(-40, 40), vy: oy + dirY * rand(40, 140) - rand(40, 160), w: pw * rand(0.5, 0.95), h: ph * rand(0.5, 0.95), rot: rand(0, 6), vr: rand(-14, 14), life: rand(0.7, 1.1), t: 1.1, color });
      made += 1;
    }
  }

  function brickColor(brick) {
    if (brick.kind === "fire") return "#ff7144";
    if (brick.kind === "cracked") return brick.hp >= 2 ? "#75a9ff" : "#4f6c9a";
    return "#8d9490";
  }

  /* ---------- 돌 처리 ---------- */
  function liveCount() { let n = 0; for (const b of bricks) if (!b.dead && !b.queued) n += 1; return n; }

  function destroy(brick, dirX = 0, dirY = -1, depth = 0) {
    if (brick.dead) return;
    brick.dead = true;
    const cx = brick.x + BRICK_W / 2, cy = brick.y + BRICK_H / 2;
    combo += 1; maxCombo = Math.max(maxCombo, combo);
    const base = brick.kind === "fire" ? 30 : brick.kind === "cracked" ? 20 : 10;
    const bonus = (combo - 1) * 2;
    score += base + bonus;
    scorePunch = 1; comboPunch = 1;
    popText(cx, cy, `+${base + bonus}`, combo >= 10 ? "#ffd27a" : combo >= 5 ? "#ff9a6e" : "#e8e7df", 10 + Math.min(combo, 12) * 0.5);

    shatter(brick, dirX, dirY, brick.kind === "fire" ? 8 : 6);
    burst(cx, cy, brickColor(brick), 8, 140);
    sparks(cx, cy, Math.atan2(dirY, dirX), 1.6, "#ffd27a", 5 + Math.min(combo, 10), 240);
    rings.push({ x: cx, y: cy, r: 6, max: 26, life: 0.25, t: 0.25, color: "#e8e7df", w: 1.5 });

    if (COMBO_CALLOUTS[combo]) {
      banner = { text: COMBO_CALLOUTS[combo], sub: `${combo} COMBO`, t: 0.9, life: 0.9, color: combo >= 15 ? "#ffd27a" : "#ff7144" };
      sfx.callout(Object.keys(COMBO_CALLOUTS).indexOf(String(combo)));
      doFlash("#ffd27a", 0.12);
      addShake(3);
    }

    if (brick.kind === "fire") {
      sfx.boom(depth);
      hitStop(0.07);
      addShake(7 + Math.min(depth, 4));
      doFlash("#ff7144", 0.28);
      rings.push({ x: cx, y: cy, r: 8, max: 70, life: 0.45, t: 0.45, color: "#ff7144", w: 4 });
      rings.push({ x: cx, y: cy, r: 2, max: 40, life: 0.3, t: 0.3, color: "#ffd27a", w: 2 });
      burst(cx, cy, "#ff7144", 24, 260, 0.8);
      burst(cx, cy, "#ffd27a", 14, 200, 0.6);
      for (let i = 0; i < 10; i += 1) spawn({ x: cx + rand(-14, 14), y: cy + rand(-6, 6), vx: rand(-30, 30), vy: rand(-90, -30), life: rand(0.6, 1.3), t: 1.3, color: "#ff7144", g: -40, drag: 1, kind: "ember", size: rand(1.5, 3) });
      // 연쇄는 한 박자씩 늦게 터져야 "번지는" 맛이 난다
      for (const other of bricks) {
        if (other.dead || other.queued || Math.abs(other.r - brick.r) > 1 || Math.abs(other.c - brick.c) > 1) continue;
        other.queued = true;
        other.hitFlash = 1;
        chain.push({ brick: other, t: 0.07 + Math.random() * 0.05, dx: Math.sign(other.c - brick.c), dy: Math.sign(other.r - brick.r) || -1, depth: depth + 1 });
      }
    } else {
      sfx.smash(brick.kind, combo);
      hitStop(0.025 + Math.min(combo, 10) * 0.003);
      addShake(1.5 + Math.min(combo, 10) * 0.25);
    }

    if (liveCount() === 0 && !chain.some((c) => !c.brick.dead)) {
      // 마지막 한 개: 슬로모션으로 여운
      slowMo(0.18, 0.55);
      doFlash("#ffffff", 0.35);
      addShake(6);
      sfx.lastBrick();
    }
  }

  function hit(brick) {
    brick.hp -= 1;
    brick.hitFlash = 1; brick.wob = 1;
    const dirX = Math.sign(ball.vx), dirY = Math.sign(ball.vy);
    if (brick.hp <= 0) destroy(brick, dirX, dirY);
    else {
      sfx.crack();
      hitStop(0.02);
      addShake(1.2);
      const cx = brick.x + BRICK_W / 2, cy = brick.y + BRICK_H / 2;
      burst(cx, cy, "#9fc1ff", 6, 120, 0.4);
      sparks(ball.x, ball.y, Math.atan2(dirY, dirX), 1.4, "#cfe0ff", 6, 200);
      debris.push({ x: cx + rand(-8, 8), y: cy, vx: rand(-60, 60), vy: rand(-120, -40), w: 3, h: 3, rot: 0, vr: rand(-10, 10), life: 0.7, t: 0.7, color: "#75a9ff" });
    }
  }

  /* ---------- 업데이트 ---------- */
  function update(rawDt) {
    if (freeze > 0) { freeze -= rawDt; return; }
    if (slowTimer > 0) slowTimer -= rawDt;
    else timeScale += (1 - timeScale) * Math.min(1, rawDt * 5);
    const dt = rawDt * timeScale;

    // 받침은 슬로모션 중에도 손을 따라와야 답답하지 않다
    let dx = 0;
    if (keys.has("left")) dx -= 1;
    if (keys.has("right")) dx += 1;
    const prevX = paddle.x;
    if (dx) { paddle.x += dx * 420 * rawDt; pointerX = null; }
    else if (pointerX !== null) paddle.x = pointerX;
    paddle.x = clamp(paddle.x, paddle.w / 2 + 4, W - paddle.w / 2 - 4);
    paddle.vel = lerp(paddle.vel, (paddle.x - prevX) / Math.max(rawDt, 0.001), 0.3);

    for (const b of bricks) if (b.spawn < 1) b.spawn = Math.min(1, b.spawn + dt * 2.6);

    if (clearTimer > 0) {
      clearTimer -= rawDt;
      if (clearTimer <= 0) nextLevel();
    } else if (ball.lost) {
      deathTimer -= rawDt;
      if (deathTimer <= 0) { if (lives <= 0) return gameOver(); resetBall(); }
    } else if (ball.stuck) {
      ball.x = paddle.x; ball.y = paddle.y - ball.r - 2 + paddle.dip * 3;
    } else {
      // Sub-steps keep the fast ball from tunnelling through thin stones.
      const steps = Math.ceil((Math.hypot(ball.vx, ball.vy) * dt) / 4);
      for (let i = 0; i < steps && !ball.lost; i += 1) moveBall(dt / steps);
      trail.push({ x: ball.x, y: ball.y });
      if (trail.length > 14) trail.shift();
      if (heat > 0.3 && Math.random() < heat * 0.8) spawn({ x: ball.x + rand(-3, 3), y: ball.y + rand(-3, 3), vx: rand(-20, 20), vy: rand(-40, 0), life: rand(0.2, 0.45), t: 0.45, color: heat > 0.7 ? "#ffd27a" : "#ff7144", g: -30, drag: 1, kind: "ember", size: rand(1, 2.2) });
    }

    for (let i = chain.length - 1; i >= 0; i -= 1) {
      const c = chain[i];
      c.t -= dt;
      if (c.t > 0) continue;
      chain.splice(i, 1);
      c.brick.queued = false;
      destroy(c.brick, c.dx, c.dy, c.depth);
    }

    bricks = bricks.filter((brick) => !brick.dead);
    if (!bricks.length && !chain.length && clearTimer <= 0 && !ball.lost) startClear();
  }

  function startClear() {
    clearTimer = 1.7;
    score += 100;
    scorePunch = 1;
    ball.stuck = true; ball.vx = ball.vy = 0;
    trail = [];
    banner = { text: `LEVEL ${level} CLEAR`, sub: `+100${maxCombo >= 5 ? ` · MAX COMBO ${maxCombo}` : ""}`, t: 1.6, life: 1.6, color: "#ffd27a" };
    doFlash("#ffd27a", 0.25);
    for (let i = 0; i < 60; i += 1) spawn({ x: rand(20, W - 20), y: H + 5, vx: rand(-30, 30), vy: rand(-420, -200), life: rand(0.9, 1.6), t: 1.6, color: Math.random() < 0.5 ? "#ffd27a" : "#ff7144", g: 220, drag: 0.6, kind: "spark", size: rand(1.2, 2.4) });
    sfx.clear();
  }

  function nextLevel() {
    level += 1;
    buildLevel();
    resetBall();
    banner = { text: `LEVEL ${level}`, sub: "", t: 1, life: 1, color: "#e8e7df" };
  }

  function bounceWall(x, y, a, ceiling) {
    sparks(x, y, a, 1.6, "#e8e7df", 4, 140);
    if (ceiling) ceilFlash = 1;
    ball.squash = 0.6;
    sfx.wall(ceiling);
  }

  function moveBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); bounceWall(0, ball.y, 0, false); }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); bounceWall(W, ball.y, Math.PI, false); }
    if (ball.y < ball.r + CEIL) { ball.y = ball.r + CEIL; ball.vy = Math.abs(ball.vy); bounceWall(ball.x, CEIL, Math.PI / 2, true); }
    if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h && Math.abs(ball.x - paddle.x) <= paddle.w / 2 + ball.r) {
      const offset = clamp((ball.x - paddle.x) / (paddle.w / 2), -1, 1);
      const angle = -Math.PI / 2 + offset * 1.05;
      ball.speed = Math.min(620, ball.speed + 4);
      ball.vx = Math.cos(angle) * ball.speed;
      ball.vy = Math.sin(angle) * ball.speed;
      ball.y = paddle.y - ball.r;
      ball.squash = 1;
      paddle.squash = 1; paddle.dip = 1; paddle.glow = 1;
      if (combo >= 5) popText(paddle.x, paddle.y - 18, `${combo} COMBO`, "#ff9a6e", 11, 0.7);
      combo = 0;
      sparks(ball.x, paddle.y, angle, 1.2, "#ffd27a", 8, 200);
      addShake(1);
      sfx.paddle(offset);
    }
    for (const brick of bricks) {
      if (brick.dead || brick.queued) continue;
      const nearestX = clamp(ball.x, brick.x, brick.x + BRICK_W);
      const nearestY = clamp(ball.y, brick.y, brick.y + BRICK_H);
      const ox = ball.x - nearestX, oy = ball.y - nearestY;
      if (ox * ox + oy * oy > ball.r * ball.r) continue;
      if (Math.abs(ox) > Math.abs(oy)) ball.vx = Math.sign(ox || -ball.vx) * Math.abs(ball.vx);
      else ball.vy = Math.sign(oy || -ball.vy) * Math.abs(ball.vy);
      ball.squash = 1;
      hit(brick);
      break;
    }
    if (ball.y > H + 20) loseBall();
  }

  function loseBall() {
    lives -= 1;
    ball.lost = true;
    combo = 0;
    deathTimer = lives <= 0 ? 1.2 : 0.8;
    lifeFlash = 1;
    trail = [];
    const x = clamp(ball.x, 10, W - 10);
    sparks(x, H, -Math.PI / 2, 1.2, "#ff7144", 26, 380);
    burst(x, H - 4, "#ff7144", 20, 200);
    rings.push({ x, y: H, r: 10, max: 90, life: 0.5, t: 0.5, color: "#ff7144", w: 4 });
    doFlash("#ff3b2e", 0.35);
    addShake(10);
    slowMo(0.3, 0.35);
    popText(W / 2, H / 2, lives <= 0 ? "" : `${lives} LEFT`, "#ff7144", 14, 1);
    sfx.lose();
  }

  function gameOver() {
    state = "over";
    const isBest = score > runBest && score > 0;
    if (score > best) { best = score; saveBest(); }
    ui.title.textContent = "Game over";
    ui.message.innerHTML = `점수 ${score} · 레벨 ${level} · 최대 콤보 ${maxCombo}<br>최고 ${best}`;
    ui.newbest.hidden = !isBest;
    overlay.hidden = false;
    sfx.over();
    if (isBest) sfx.best();
  }

  // 시간 흐름과 무관하게 계속 움직이는 연출들
  function updateFx(rawDt) {
    const dt = rawDt * (freeze > 0 ? 0.05 : timeScale);
    clock += rawDt;
    for (const p of particles) {
      p.vy += (p.g || 0) * dt;
      const d = Math.max(0, 1 - (p.drag || 0) * dt);
      p.vx *= d; p.vy *= d;
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    }
    particles = particles.filter((p) => p.life > 0);
    for (const d of debris) { d.vy += 900 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt; d.life -= dt; }
    debris = debris.filter((d) => d.life > 0 && d.y < H + 20);
    for (const r of rings) r.life -= dt;
    rings = rings.filter((r) => r.life > 0);
    for (const t of texts) { t.life -= rawDt; t.y -= 28 * rawDt; }
    texts = texts.filter((t) => t.life > 0);
    if (banner && (banner.t -= rawDt) <= 0) banner = null;

    if (bricks) for (const b of bricks) { b.hitFlash = Math.max(0, b.hitFlash - rawDt * 6); b.wob = Math.max(0, b.wob - rawDt * 4); }
    if (paddle) {
      paddle.squash = Math.max(0, paddle.squash - rawDt * 6);
      paddle.dip = Math.max(0, paddle.dip - rawDt * 8);
      paddle.glow = Math.max(0, paddle.glow - rawDt * 3);
    }
    if (ball) ball.squash = Math.max(0, ball.squash - rawDt * 7);
    shake = shake < 0.1 ? 0 : shake * Math.pow(0.0006, rawDt);
    flash.a = Math.max(0, flash.a - rawDt * 2.5);
    ceilFlash = Math.max(0, ceilFlash - rawDt * 4);
    lifeFlash = Math.max(0, lifeFlash - rawDt * 1.5);
    scorePunch = Math.max(0, scorePunch - rawDt * 5);
    comboPunch = Math.max(0, comboPunch - rawDt * 4);
    heat = lerp(heat, Math.min(1, combo / 15), Math.min(1, rawDt * 4));
    shownScore = score < shownScore ? score : lerp(shownScore, score, Math.min(1, rawDt * 12));
    if (score - shownScore < 0.5) shownScore = score;

    // 배경에 천천히 떠오르는 불씨
    while (embers.length < 34) embers.push({ x: rand(0, W), y: rand(CEIL, H), s: rand(8, 26), r: rand(0.6, 1.6), seed: rand(0, 10) });
    for (const e of embers) {
      e.y -= e.s * (1 + heat * 2) * rawDt;
      e.x += Math.sin(clock * 0.8 + e.seed) * 8 * rawDt;
      if (e.y < CEIL) { e.y = H + 4; e.x = rand(0, W); }
    }
  }

  /* ---------- 그리기 ---------- */
  function drawBackground() {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#151a1f");
    bg.addColorStop(1, `rgb(${Math.round(lerp(26, 52, heat))},${Math.round(lerp(30, 27, heat))},${Math.round(lerp(35, 28, heat))})`);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    // 바닥에서 올라오는 열기
    ctx.globalCompositeOperation = "lighter";
    drawGlow("#ff7144", W / 2, H + 40, 260, 0.08 + heat * 0.18 + Math.sin(clock * 2) * 0.02);
    for (const e of embers) drawGlow("#ff7144", e.x, e.y, e.r * 4, (0.25 + heat * 0.4) * (0.6 + Math.sin(clock * 5 + e.seed * 7) * 0.4));
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.fillStyle = `rgba(232,231,223,${0.08 + ceilFlash * 0.4})`;
    ctx.fillRect(0, CEIL, W, 1 + ceilFlash);
  }

  function easeOutBack(t) { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }

  function drawBricks() {
    for (const brick of bricks) {
      if (brick.spawn <= 0) continue;
      const s = easeOutBack(brick.spawn);
      const cx = brick.x + BRICK_W / 2, cy = brick.y + BRICK_H / 2 - (1 - Math.min(1, s)) * 30;
      const wob = brick.wob * Math.sin(brick.wob * 18) * 0.12;
      const color = brickColor(brick);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale((1 + wob) * Math.min(1.08, s), (1 - wob) * Math.min(1.08, s));
      ctx.globalAlpha = Math.min(1, brick.spawn * 2);

      if (brick.kind === "fire") {
        ctx.globalCompositeOperation = "lighter";
        drawGlow("#ff7144", 0, 0, BRICK_W * 0.8, (0.25 + Math.sin(clock * 6 + brick.seed) * 0.1) * Math.min(1, brick.spawn * 2));
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = Math.min(1, brick.spawn * 2);
        const g = ctx.createLinearGradient(0, -BRICK_H / 2, 0, BRICK_H / 2);
        const f = 0.5 + Math.sin(clock * 9 + brick.seed * 3) * 0.5;
        g.addColorStop(0, f > 0.5 ? "#ffd27a" : "#ffb36a");
        g.addColorStop(0.5, "#ff7144");
        g.addColorStop(1, "#c8401f");
        ctx.fillStyle = g;
      } else ctx.fillStyle = color;
      ctx.beginPath(); ctx.roundRect(-BRICK_W / 2, -BRICK_H / 2, BRICK_W, BRICK_H, 4); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.2)";
      ctx.fillRect(-BRICK_W / 2 + 4, -BRICK_H / 2 + 3, BRICK_W - 8, 3);
      ctx.fillStyle = "rgba(0,0,0,.18)";
      ctx.fillRect(-BRICK_W / 2 + 3, BRICK_H / 2 - 4, BRICK_W - 6, 2);
      if (brick.kind === "cracked" && brick.hp === 1) {
        ctx.strokeStyle = "rgba(16,20,24,.75)"; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-BRICK_W * 0.2, -BRICK_H / 2); ctx.lineTo(-BRICK_W * 0.05, BRICK_H * 0.1); ctx.lineTo(BRICK_W * 0.1, BRICK_H / 2);
        ctx.moveTo(-BRICK_W * 0.05, BRICK_H * 0.1); ctx.lineTo(BRICK_W * 0.25, -BRICK_H * 0.1);
        ctx.stroke();
      }
      if (brick.hitFlash > 0) {
        ctx.globalAlpha = brick.hitFlash * 0.85;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.roundRect(-BRICK_W / 2, -BRICK_H / 2, BRICK_W, BRICK_H, 4); ctx.fill();
      }
      ctx.restore();
      // 불꽃 돌은 가끔 불티를 흘린다
      if (brick.kind === "fire" && brick.spawn >= 1 && Math.random() < 0.06) spawn({ x: brick.x + rand(4, BRICK_W - 4), y: brick.y, vx: rand(-8, 8), vy: rand(-40, -15), life: rand(0.4, 0.8), t: 0.8, color: "#ff9a5e", g: -20, drag: 1, kind: "ember", size: rand(1, 1.8) });
    }
  }

  function drawDebris() {
    for (const d of debris) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, d.life / 0.3);
      ctx.translate(d.x, d.y); ctx.rotate(d.rot);
      ctx.fillStyle = d.color;
      ctx.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
      ctx.fillStyle = "rgba(255,255,255,.18)";
      ctx.fillRect(-d.w / 2, -d.h / 2, d.w, Math.min(1.5, d.h));
      ctx.restore();
    }
  }

  function ballColor() { return heat > 0.66 ? "#fff1c9" : heat > 0.33 ? "#ffd27a" : "#ff7144"; }

  function drawBall() {
    if (!ball || ball.lost || clearTimer > 0) return;
    const col = ballColor();
    // 꼬리: 속도와 열기에 따라 길고 밝아진다
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < trail.length; i += 1) {
      const k = (i + 1) / trail.length;
      drawGlow(heat > 0.5 ? "#ffd27a" : "#ff7144", trail[i].x, trail[i].y, ball.r * (1 + k * (1.4 + heat)), k * (0.28 + heat * 0.3));
    }
    drawGlow(col, ball.x, ball.y, ball.r * (3.2 + heat * 2 + Math.sin(clock * 12) * 0.3), 0.55);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;

    const speed = Math.hypot(ball.vx, ball.vy);
    const stretch = ball.stuck ? 0 : Math.min(0.32, speed / 620 * 0.3);
    const sq = ball.squash * 0.35;
    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.rotate(Math.atan2(ball.vy, ball.vx));
    ctx.scale(1 + stretch - sq, 1 - stretch * 0.5 + sq);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(0, 0, ball.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.beginPath(); ctx.arc(-ball.r * 0.25, -ball.r * 0.3, ball.r * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawPaddle() {
    if (!paddle) return;
    const w = paddle.w * (1 + paddle.squash * 0.18), h = paddle.h * (1 - paddle.squash * 0.35);
    const y = paddle.y + paddle.dip * 3 + (paddle.h - h);
    const tilt = reduceMotion ? 0 : clamp(paddle.vel / 9000, -0.06, 0.06);
    ctx.globalCompositeOperation = "lighter";
    drawGlow("#ff7144", paddle.x, y + h, w * 0.7, 0.18 + paddle.glow * 0.5);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(paddle.x, y + h / 2);
    ctx.rotate(tilt);
    const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
    g.addColorStop(0, "#ffffff"); g.addColorStop(1, "#bdbbb1");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 5); ctx.fill();
    // 받침 양끝의 불씨 표시: 가장자리로 받으면 각이 커진다는 힌트
    ctx.fillStyle = "#ff7144";
    ctx.fillRect(-w / 2 + 4, -1, 6, 2); ctx.fillRect(w / 2 - 10, -1, 6, 2);
    if (paddle.glow > 0) {
      ctx.globalAlpha = paddle.glow * 0.7;
      ctx.fillStyle = "#ffd27a";
      ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 5); ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    if (state === "play" && ball && ball.stuck && !ball.lost && clearTimer <= 0) {
      // 발사 방향 안내 점선
      for (let i = 1; i <= 6; i += 1) {
        ctx.globalAlpha = (0.5 - i * 0.07) * (0.6 + Math.sin(clock * 6 - i) * 0.4);
        ctx.fillStyle = "#ffd27a";
        ctx.beginPath(); ctx.arc(ball.x, ball.y - i * 14, 1.6, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawParticles() {
    ctx.globalCompositeOperation = "lighter";
    for (const p of particles) {
      const a = Math.max(0, Math.min(1, p.life / (p.t * 0.5)));
      if (p.kind === "spark") {
        ctx.globalAlpha = a;
        ctx.strokeStyle = p.color; ctx.lineWidth = p.size;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke();
      } else if (p.kind === "ember") {
        drawGlow(p.color, p.x, p.y, p.size * 3, a * (0.6 + Math.random() * 0.4));
      } else {
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
    }
    for (const r of rings) {
      const k = 1 - r.life / r.t;
      ctx.globalAlpha = (1 - k) * 0.8;
      ctx.strokeStyle = r.color; ctx.lineWidth = r.w * (1 - k) + 0.5;
      ctx.beginPath(); ctx.arc(r.x, r.y, lerp(r.r, r.max, 1 - Math.pow(1 - k, 3)), 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }

  function drawTexts() {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const t of texts) {
      if (!t.text) continue;
      const k = 1 - t.life / t.t;
      const pop = k < 0.15 ? 0.6 + (k / 0.15) * 0.6 : 1.2 - Math.min(0.2, (k - 0.15) * 0.8);
      ctx.globalAlpha = Math.min(1, t.life / 0.3);
      ctx.font = `bold ${Math.round(t.size * pop)}px ui-monospace, Consolas, monospace`;
      ctx.fillStyle = "rgba(16,20,24,.6)";
      ctx.fillText(t.text, t.x + 1, t.y + 1);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, t.x, t.y);
    }
    if (banner) {
      const k = 1 - banner.t / banner.life;
      const s = k < 0.2 ? easeOutBack(k / 0.2) : 1 + (k - 0.2) * 0.08;
      ctx.globalAlpha = Math.min(1, banner.t / 0.3);
      ctx.save();
      ctx.translate(W / 2, H * 0.52);
      ctx.scale(s, s);
      ctx.globalCompositeOperation = "lighter";
      drawGlow(banner.color, 0, 0, 120, 0.25 * Math.min(1, banner.t / 0.3));
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = Math.min(1, banner.t / 0.3);
      ctx.font = "bold 26px ui-monospace, Consolas, monospace";
      ctx.fillStyle = "rgba(16,20,24,.7)";
      ctx.fillText(banner.text, 2, 2);
      ctx.fillStyle = banner.color;
      ctx.fillText(banner.text, 0, 0);
      if (banner.sub) {
        ctx.font = "11px ui-monospace, Consolas, monospace";
        ctx.fillStyle = "#e8e7df";
        ctx.fillText(banner.sub, 0, 24);
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  }

  function drawHud() {
    ctx.fillStyle = "rgba(16,20,24,.55)";
    ctx.fillRect(0, 0, W, CEIL);
    ctx.font = "11px ui-monospace, Consolas, monospace";
    ctx.textBaseline = "middle";
    // 점수는 오를 때마다 톡 튄다
    ctx.save();
    ctx.translate(12, 18);
    ctx.scale(1 + scorePunch * 0.25, 1 + scorePunch * 0.25);
    ctx.fillStyle = scorePunch > 0.2 ? "#ffd27a" : "#e8e7df";
    ctx.fillText(`SCORE ${Math.round(shownScore ?? 0)}`, 0, 0);
    ctx.restore();

    ctx.textAlign = "center";
    if (combo >= 2) {
      ctx.save();
      ctx.translate(W / 2, 18);
      const s = 1 + comboPunch * 0.4;
      ctx.scale(s, s);
      ctx.font = "bold 12px ui-monospace, Consolas, monospace";
      ctx.fillStyle = combo >= 10 ? "#ffd27a" : "#ff7144";
      ctx.fillText(`x${combo} COMBO`, 0, 0);
      ctx.restore();
    } else {
      ctx.fillStyle = "#899197";
      ctx.fillText(`LEVEL ${level ?? 1}`, W / 2, 18);
    }

    ctx.textAlign = "right";
    ctx.fillStyle = "#899197";
    ctx.fillText(`BEST ${best}`, W - 36, 18);
    const lw = ctx.measureText(`BEST ${best}`).width;
    for (let i = 0; i < 3; i += 1) {
      const x = W - 36 - lw - 14 - (2 - i) * 11;
      const alive = i < (lives ?? 0);
      const justLost = i === lives && lifeFlash > 0;
      if (alive) {
        ctx.globalCompositeOperation = "lighter";
        drawGlow("#ff7144", x, 18, 7, 0.5);
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = alive ? "#ff7144" : justLost ? `rgba(255,59,46,${lifeFlash})` : "rgba(137,145,151,.3)";
      ctx.beginPath(); ctx.arc(x, 18, justLost ? 3 + lifeFlash * 4 : 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";

    if (state === "play" && ball && ball.stuck && !ball.lost && clearTimer <= 0) {
      ctx.globalAlpha = 0.5 + Math.sin(clock * 4) * 0.25;
      ctx.fillStyle = "#e8e7df"; ctx.textAlign = "center";
      ctx.fillText("SPACE / 클릭으로 발사", W / 2, H - 70);
      ctx.textAlign = "left"; ctx.globalAlpha = 1;
    }
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate(rand(-shake, shake), rand(-shake, shake));
      ctx.rotate(rand(-shake, shake) * 0.0015);
    }
    drawBackground();
    drawBricks();
    drawDebris();
    drawPaddle();
    drawBall();
    drawParticles();
    drawTexts();
    ctx.restore();
    if (flash.a > 0) {
      ctx.globalAlpha = flash.a;
      ctx.fillStyle = flash.color;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    // 가장자리 비네트
    const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.75);
    v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, `rgba(0,0,0,${0.35 + lifeFlash * 0.2})`);
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    drawHud();
  }

  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (state === "play") update(dt);
    updateFx(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function start() {
    if (state === "play") return;
    sfx.init();
    reset();
    state = "play";
    overlay.hidden = true;
    runBest = best;
    banner = { text: "LEVEL 1", sub: "", t: 1, life: 1, color: "#e8e7df" };
    sfx.start();
  }

  function syncMute() { muteBtn.classList.toggle("muted", sfx.muted); }
  function toggleMute() { sfx.init(); sfx.toggleMute(); syncMute(); }

  const KEYMAP = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right" };
  addEventListener("keydown", (event) => {
    if (KEYMAP[event.code]) { event.preventDefault(); keys.add(KEYMAP[event.code]); }
    if (event.code === "KeyM") toggleMute();
    if (event.code === "Space" || event.code === "Enter") { event.preventDefault(); if (state === "play") launch(); else start(); }
  });
  addEventListener("keyup", (event) => { if (KEYMAP[event.code]) keys.delete(KEYMAP[event.code]); });
  addEventListener("blur", () => keys.clear());
  const toGame = (event) => (event.clientX - canvas.getBoundingClientRect().left) / scale;
  canvas.addEventListener("pointermove", (event) => { if (state === "play") pointerX = toGame(event); });
  canvas.addEventListener("pointerdown", (event) => { if (state !== "play") return; pointerX = toGame(event); launch(); });
  overlay.addEventListener("pointerdown", () => start());
  muteBtn.addEventListener("pointerdown", (event) => event.stopPropagation());
  muteBtn.addEventListener("click", (event) => { event.stopPropagation(); toggleMute(); muteBtn.blur(); });
  addEventListener("resize", fit);
  addEventListener("pointerdown", () => window.focus());

  syncMute();
  fit();
  reset();
  requestAnimationFrame((now) => { last = now; loop(now); });
</script>
</body>
</html>
