<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stone Pairs</title>
<style>
  :root {
    --bg: #101418; --panel: #171c21; --panel-2: #20272d; --line: rgba(232,231,223,.13);
    --cream: #e8e7df; --muted: #899197; --orange: #ff7144; --blue: #75a9ff; --green: #a6cd7c; --gold: #ffd27a;
    --heat: 0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--cream); font-family: ui-monospace, "DM Mono", Consolas, monospace; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  body { background: radial-gradient(120% 90% at 50% 0%, #1b2229 0%, var(--bg) 62%); }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px; }

  /* HUD */
  .hud { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; font-size: 11px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
  .hud span { display: inline-flex; align-items: baseline; gap: 6px; }
  .hud b { display: inline-block; min-width: 1ch; color: var(--cream); font-size: 13px; transform-origin: 50% 70%; }
  .hud .combo b { color: var(--orange); transition: text-shadow .3s; text-shadow: 0 0 calc(var(--heat) * 14px) rgba(255,113,68,.9); }
  .progress { position: relative; width: var(--board-w, 280px); max-width: 100%; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .progress i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 2px; }
  #fill { background: linear-gradient(90deg, var(--orange), var(--gold)); transition: width .4s cubic-bezier(.3,1.5,.5,1); box-shadow: 0 0 8px rgba(255,113,68,.6); }
  #memo { width: 100%; background: var(--blue); box-shadow: 0 0 8px rgba(117,169,255,.7); transform-origin: left; transform: scaleX(0); }

  /* 보드 */
  .board {
    display: grid; gap: var(--gap); padding: 10px; border-radius: 18px;
    box-shadow: 0 0 calc(var(--heat) * 60px) calc(var(--heat) * 4px) rgba(255,113,68, calc(var(--heat) * .32)), inset 0 0 0 1px rgba(232,231,223, calc(.04 + var(--heat) * .12));
    transition: box-shadow .45s;
  }
  .tile { position: relative; width: var(--size); height: var(--size); padding: 0; border: 0; background: none; perspective: 700px; cursor: pointer; color: inherit; }
  .tile .shadow { position: absolute; inset: 10% 6% -5%; border-radius: 12px; background: rgba(0,0,0,.55); filter: blur(6px); transition: transform .2s, opacity .2s; }
  .tile .lift {
    position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    transform: translateY(var(--ty, 0px)) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(var(--s, 1));
    transition: transform .18s ease-out;
  }
  .tile .inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .46s cubic-bezier(.34,1.56,.64,1); }
  .tile:not(.open):not(.done) .inner { transition: transform .32s cubic-bezier(.5,0,.3,1.25); }
  .tile.open .inner, .tile.done .inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 11px; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 1px solid var(--line); overflow: hidden; }
  .back {
    background:
      radial-gradient(60% 50% at 30% 20%, rgba(255,255,255,.06), transparent 70%),
      radial-gradient(40% 30% at 75% 80%, rgba(0,0,0,.25), transparent 70%),
      linear-gradient(140deg, #252d34, var(--panel));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07), inset 0 -3px 0 rgba(0,0,0,.3);
  }
  .back::after { content: ""; width: 26%; height: 26%; border-radius: 30%; border: 1px solid rgba(232,231,223,.18); transform: rotate(45deg); box-shadow: inset 0 0 6px rgba(0,0,0,.4); transition: border-color .2s; }
  .back::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.09) 50%, transparent 62%);
    background-size: 260% 100%; background-position: var(--sheen, 110%) 0; transition: background-position .25s;
  }
  .front {
    transform: rotateY(180deg); font-size: calc(var(--size) * .44); color: var(--c);
    background: radial-gradient(70% 70% at 50% 40%, color-mix(in srgb, var(--c) 14%, #1d2328), #181d22);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), inset 0 -3px 0 rgba(0,0,0,.3);
    transition: border-color .25s, background .25s, box-shadow .35s;
  }
  .front span { display: block; line-height: 1; font-variant-emoji: text; transition: opacity .35s, text-shadow .35s, transform .35s; }
  .tile.done .lift { --s: .92; }
  .tile.done .shadow { opacity: .4; transform: scale(.92); }
  .tile.done .front { border-color: color-mix(in srgb, var(--c) 45%, transparent); box-shadow: inset 0 0 calc(var(--size) * .25) color-mix(in srgb, var(--c) 22%, transparent), inset 0 -3px 0 rgba(0,0,0,.3); }
  .tile.done .front span { opacity: .62; text-shadow: 0 0 12px var(--c); transform: scale(.9); }
  .tile.miss .front { border-color: rgba(255,113,68,.85); background: radial-gradient(70% 70% at 50% 40%, #3a2420, #1e1716); }
  .tile:focus-visible { outline: none; }
  .tile:focus-visible .lift { outline: 2px solid var(--orange); outline-offset: 2px; border-radius: 11px; }
  .board.live .tile:not(.done):not(.open):active .lift { --s: .93; --ty: 1px; }
  @media (hover: hover) {
    .board.live .tile:not(.done):not(.open):hover .lift { --ty: -4px; }
    .board.live .tile:not(.done):not(.open):hover .shadow { transform: translateY(5px) scale(.94); opacity: .7; }
    .board.live .tile:not(.done):not(.open):hover .back::after { border-color: rgba(255,113,68,.5); }
  }

  /* 연출 레이어 */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
  #floats { position: fixed; inset: 0; pointer-events: none; z-index: 21; }
  .float { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-weight: 700; font-size: 20px; color: var(--cream); text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,.6); }
  .float.gain { color: var(--gold); font-size: 24px; }
  .float.combo { color: var(--orange); font-size: 13px; letter-spacing: .14em; }
  .float.bad { color: #ff8f6e; font-size: 13px; letter-spacing: .14em; }
  .callout {
    position: fixed; left: 50%; top: 44%; transform: translate(-50%, -50%); z-index: 22; pointer-events: none;
    white-space: nowrap; text-align: center; font-weight: 700; letter-spacing: .12em;
    font-size: clamp(30px, 8vmin, 60px); color: var(--cream);
    text-shadow: 0 0 24px var(--glow, rgba(255,113,68,.8)), 0 4px 0 #000;
  }
  .callout small { display: block; margin-top: 6px; font-size: .32em; letter-spacing: .3em; color: var(--glow-text, var(--orange)); }
  #flash { position: fixed; inset: 0; z-index: 19; pointer-events: none; opacity: 0; background: #fff; }
  #vignette { position: fixed; inset: 0; z-index: 18; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(255,80,50,.35) 100%); }

  /* 오버레이 */
  .overlay { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; padding: 18px; background: rgba(12,15,18,.72); backdrop-filter: blur(4px); cursor: pointer; }
  .overlay[hidden] { display: none; }
  .card { width: min(380px, 100%); display: grid; gap: 10px; justify-items: center; text-align: center; padding: 26px 24px 22px; border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(160deg, #1d2329, #14181c); box-shadow: 0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05); }
  .card h1 { margin: 0; font-size: 26px; letter-spacing: .06em; }
  .card p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.7; }
  .card .accent { color: var(--orange); letter-spacing: .1em; animation: blink 1.1s ease-in-out infinite alternate; }
  @keyframes blink { from { opacity: .45; } to { opacity: 1; } }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 22px; width: 100%; max-width: 260px; margin: 4px 0; font-size: 12px; }
  .stats:empty { display: none; }
  .stats dt { color: var(--muted); text-align: left; letter-spacing: .08em; text-transform: uppercase; font-size: 10px; align-self: center; }
  .stats dd { margin: 0; text-align: right; font-weight: 700; }
  .stats dd.hi { color: var(--gold); }
  .stats .total { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
  .stats .total b { font-size: 30px; color: var(--cream); }
  .newbest { color: var(--gold); font-size: 11px; letter-spacing: .3em; text-shadow: 0 0 12px rgba(255,210,122,.8); animation: blink .4s ease-in-out infinite alternate; }

  /* 시작 화면의 미니 돌판 */
  .demo { display: flex; gap: 8px; margin: 2px 0 6px; perspective: 400px; }
  .demo[hidden] { display: none; }
  .demo i { position: relative; width: 38px; height: 38px; transform-style: preserve-3d; animation: demo 3.2s cubic-bezier(.34,1.56,.64,1) infinite; }
  .demo i:nth-child(2) { animation-delay: .25s; }
  .demo i:nth-child(3) { animation-delay: .5s; }
  .demo i::before, .demo i::after { content: ""; position: absolute; inset: 0; border-radius: 8px; border: 1px solid var(--line); backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; font-style: normal; font-size: 17px; }
  .demo i::before { background: linear-gradient(140deg, #252d34, var(--panel)); }
  .demo i::after { content: attr(data-g); color: var(--c); transform: rotateY(180deg); background: #1d2328; }
  @keyframes demo { 0%, 18% { transform: rotateY(0); } 30%, 70% { transform: rotateY(180deg); } 82%, 100% { transform: rotateY(360deg); } }

  #mute { position: fixed; top: 12px; right: 12px; z-index: 26; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
  #mute:hover { color: var(--cream); }
  #mute svg { width: 18px; height: 18px; }
  #mute .off { display: none; }
  #mute.muted .on { display: none; }
  #mute.muted .off { display: inline; }

  @media (prefers-reduced-motion: reduce) {
    .demo i, .card .accent, .newbest { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="hud">
    <span>Stage <b id="stage">1</b></span><span>Score <b id="score">0</b></span><span class="combo">Combo <b id="combo">0</b></span><span>Time <b id="time">0</b></span><span>Best <b id="best">0</b></span>
  </div>
  <div class="progress" aria-hidden="true"><i id="fill"></i><i id="memo"></i></div>
  <div class="board" id="board"></div>
</div>
<canvas id="fx"></canvas>
<div id="floats"></div>
<div id="flash"></div>
<div id="vignette"></div>
<button id="mute" type="button" aria-label="소리 켜기/끄기">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/><path class="on" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="off" d="M16 9l5 6M21 9l-5 6"/></svg>
</button>
<div class="overlay" id="overlay">
  <div class="card" id="card">
    <div class="demo" id="demo"><i data-g="◆" style="--c:#ff7144"></i><i data-g="●" style="--c:#75a9ff"></i><i data-g="◆" style="--c:#ff7144"></i></div>
    <h1 id="title">Stone Pairs</h1>
    <p id="message">돌판 두 장을 뒤집어 같은 문양을 찾으세요.<br>연속으로 맞히면 콤보 점수 · 스테이지마다 판이 커집니다.<br>시작하면 2초 동안 모든 문양이 보여요.</p>
    <dl class="stats" id="stats"></dl>
    <p class="accent" id="prompt">SPACE 또는 터치로 시작</p>
  </div>
</div>
<script>
  const STAGES = [[4, 3], [4, 4], [5, 4], [6, 5], [6, 6]];
  const SYMBOLS = [
    ["◆", "#ff7144"], ["●", "#75a9ff"], ["▲", "#a6cd7c"], ["■", "#e8e7df"], ["★", "#ffd27a"], ["✦", "#ff7144"],
    ["✚", "#75a9ff"], ["☾", "#ffd27a"], ["♠", "#a6cd7c"], ["♣", "#e8e7df"], ["♥", "#ff7144"], ["✿", "#c9a2ff"],
    ["☀", "#ffd27a"], ["♪", "#75a9ff"], ["⬟", "#a6cd7c"], ["✱", "#c9a2ff"], ["⬢", "#ff7144"], ["◐", "#e8e7df"],
  ];
  const PREVIEW_MS = 2000;
  const COMBO_CALLOUTS = { 3: "NICE", 5: "GREAT", 8: "AMAZING", 12: "UNREAL" };

  const $ = (id) => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (items) => items[Math.floor(Math.random() * items.length)];
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const finePointer = matchMedia("(hover: hover) and (pointer: fine)").matches;

  const boardEl = $("board");
  const overlay = $("overlay");
  const ui = { stage: $("stage"), score: $("score"), combo: $("combo"), time: $("time"), best: $("best"), title: $("title"), message: $("message"), stats: $("stats"), prompt: $("prompt"), demo: $("demo"), card: $("card"), fill: $("fill"), memo: $("memo") };

  /* ---------- 사운드: 전부 Web Audio로 합성 ---------- */
  const sfx = (() => {
    const MUTE_KEY = "stone-pairs-muted";
    let ac = null, out = null, wet = null, noiseBuf = null, muted = false;
    try { muted = localStorage.getItem(MUTE_KEY) === "1"; } catch { /* storage unavailable */ }

    function init() {
      if (ac) { if (ac.state === "suspended") ac.resume(); return; }
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      ac = new Ctx();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 4;
      comp.attack.value = 0.003; comp.release.value = 0.15;
      out = ac.createGain();
      out.gain.value = muted ? 0 : 0.8;
      out.connect(comp); comp.connect(ac.destination);
      // 짧은 피드백 딜레이: 돌방 안에서 울리는 잔향
      wet = ac.createGain();
      const delay = ac.createDelay(1), fb = ac.createGain(), damp = ac.createBiquadFilter();
      delay.delayTime.value = 0.14; fb.gain.value = 0.36;
      damp.type = "lowpass"; damp.frequency.value = 2200;
      wet.connect(delay); delay.connect(damp); damp.connect(fb); fb.connect(delay); damp.connect(out);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i += 1) d[i] = Math.random() * 2 - 1;
    }

    function env(gain, t, attack, peak, dur) {
      gain.setValueAtTime(0.0001, t);
      gain.exponentialRampToValueAtTime(peak, t + attack);
      gain.exponentialRampToValueAtTime(0.0001, t + dur);
    }

    function connect(g, send) {
      g.connect(out);
      if (!send) return;
      const s = ac.createGain();
      s.gain.value = send;
      g.connect(s); s.connect(wet);
    }

    // 주파수 경로: [[시간, 주파수], ...] 를 지수 램프로 잇는다
    function tone(type, path, dur, vol, { at = 0, attack = 0.004, send = 0, vibrato = 0, vibRate = 28 } = {}) {
      if (!ac) return;
      const t = ac.currentTime + at;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(path[0][1], t);
      for (let i = 1; i < path.length; i += 1) o.frequency.exponentialRampToValueAtTime(path[i][1], t + path[i][0]);
      if (vibrato) {
        const lfo = ac.createOscillator(), lg = ac.createGain();
        lfo.frequency.value = vibRate; lg.gain.value = vibrato;
        lfo.connect(lg); lg.connect(o.frequency);
        lfo.start(t); lfo.stop(t + dur + 0.05);
      }
      env(g.gain, t, attack, vol, dur);
      o.connect(g); connect(g, send);
      o.start(t); o.stop(t + dur + 0.05);
    }

    function noise(dur, vol, { at = 0, type = "bandpass", f0 = 1000, f1 = 0, q = 1, attack = 0.002, send = 0 } = {}) {
      if (!ac) return;
      const t = ac.currentTime + at;
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noiseBuf;
      f.type = type; f.Q.value = q;
      f.frequency.setValueAtTime(f0, t);
      if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      env(g.gain, t, attack, vol, dur);
      s.connect(f); f.connect(g); connect(g, send);
      s.start(t, Math.random() * 0.4); s.stop(t + dur + 0.05);
    }

    const note = (n) => 440 * Math.pow(2, (n - 69) / 12);
    // 콤보 사다리는 펜타토닉: 어디서 끊겨도 듣기 좋다
    const PENTA = [0, 2, 4, 7, 9];
    const step = (i) => PENTA[i % 5] + Math.floor(i / 5) * 12;
    let lastHover = 0;

    return {
      init,
      get muted() { return muted; },
      toggleMute() {
        muted = !muted;
        try { localStorage.setItem(MUTE_KEY, muted ? "1" : "0"); } catch { /* storage unavailable */ }
        if (out) out.gain.setTargetAtTime(muted ? 0 : 0.8, ac.currentTime, 0.02);
        return muted;
      },
      hover() {
        if (!ac || ac.currentTime - lastHover < 0.05) return;
        lastHover = ac.currentTime;
        tone("sine", [[0, rand(2100, 2500)]], 0.025, 0.02, { attack: 0.001 });
      },
      // 돌판 뒤집기: 딱 + 묵직한 몸통. 두 번째 장은 살짝 높게
      flip(second) {
        const p = rand(0.94, 1.06) * (second ? 1.12 : 1);
        noise(0.035, 0.3, { type: "highpass", f0: 3200, q: 0.7 });
        tone("triangle", [[0, 1300 * p], [0.04, 620 * p]], 0.05, 0.2, { attack: 0.001 });
        tone("sine", [[0, 250 * p], [0.08, 150 * p]], 0.09, 0.3, { attack: 0.002 });
        noise(0.08, 0.1, { at: 0.005, type: "bandpass", f0: 900 * p, f1: 480 * p, q: 2 });
      },
      unflip() {
        const p = rand(0.92, 1.02);
        noise(0.03, 0.12, { type: "highpass", f0: 2400 });
        tone("sine", [[0, 210 * p], [0.07, 120 * p]], 0.08, 0.18);
      },
      // 짝 맞춤: 돌끼리 부딪는 딱 + 콤보만큼 올라가는 종소리
      match(combo) {
        const n = 72 + step(Math.min(combo - 1, 14));
        noise(0.03, 0.38, { type: "highpass", f0: 3600 });
        tone("triangle", [[0, 1900], [0.03, 950]], 0.04, 0.22, { attack: 0.001 });
        tone("sine", [[0, note(n)]], 0.95, 0.26, { at: 0.02, send: 0.6 });
        tone("sine", [[0, note(n) * 2.01]], 0.5, 0.07, { at: 0.02, send: 0.6 });
        tone("triangle", [[0, note(n + 7)]], 0.6, 0.06, { at: 0.08, send: 0.5 });
        for (let i = 0; i < 3; i += 1) tone("sine", [[0, rand(3000, 5200)]], 0.06, 0.03, { at: 0.1 + i * 0.035, send: 0.4 });
      },
      // 틀림: 둔탁한 퍽 + 불협 버즈
      miss() {
        noise(0.12, 0.32, { type: "lowpass", f0: 700, f1: 150, q: 0.8 });
        tone("sine", [[0, 150], [0.14, 70]], 0.16, 0.3);
        tone("square", [[0, 196], [0.18, 180]], 0.2, 0.045, { at: 0.03 });
        tone("square", [[0, 208], [0.18, 172]], 0.22, 0.04, { at: 0.03 });
      },
      comboBreak() {
        tone("sawtooth", [[0, 520], [0.34, 130]], 0.36, 0.05, { vibrato: 16, vibRate: 11 });
        tone("triangle", [[0, 392], [0.32, 98]], 0.34, 0.13);
      },
      deal(i) {
        tone("sine", [[0, 320 + i * 22], [0.04, 200 + i * 14]], 0.05, 0.09);
        noise(0.02, 0.07, { type: "highpass", f0: 3000 });
      },
      reveal(i) {
        tone("triangle", [[0, note(64 + step(i))]], 0.16, 0.07, { send: 0.5 });
        noise(0.025, 0.08, { type: "highpass", f0: 3200 });
      },
      conceal(i) {
        tone("sine", [[0, note(79 - step(i))]], 0.1, 0.05);
        noise(0.02, 0.07, { type: "highpass", f0: 2600 });
      },
      memoTick() { tone("sine", [[0, 1760]], 0.03, 0.03, { attack: 0.001 }); },
      go() {
        noise(0.28, 0.1, { type: "bandpass", f0: 500, f1: 3200, q: 0.8, attack: 0.1 });
        tone("triangle", [[0, note(76)]], 0.14, 0.17, { at: 0.2, send: 0.4 });
        tone("triangle", [[0, note(83)]], 0.35, 0.2, { at: 0.28, send: 0.5 });
      },
      comboUp(level) {
        const base = 72 + Math.min(level, 6);
        [0, 4, 7, 12].forEach((n, i) => {
          tone("triangle", [[0, note(base + n)]], 0.18, 0.18, { at: i * 0.055, send: 0.4 });
          tone("sine", [[0, note(base + n + 12)]], 0.14, 0.07, { at: i * 0.055 });
        });
      },
      sparkle(i) { tone("sine", [[0, note(79 + step(i))]], 0.22, 0.06, { send: 0.6 }); },
      stageClear() {
        [[72, 0], [76, 0.08], [79, 0.16], [84, 0.26]].forEach(([n, at]) => {
          tone("triangle", [[0, note(n)]], 0.3, 0.2, { at, send: 0.5 });
          tone("square", [[0, note(n + 12)]], 0.12, 0.03, { at });
        });
        tone("sine", [[0, note(88)]], 0.9, 0.12, { at: 0.36, send: 0.7 });
      },
      countUp(i) { tone("sine", [[0, 600 + Math.min(i, 50) * 20]], 0.04, 0.08, { attack: 0.001 }); },
      fanfare() {
        [[72, 0], [76, 0.1], [79, 0.2], [84, 0.32], [79, 0.46], [84, 0.56], [88, 0.7]].forEach(([n, at]) => {
          tone("triangle", [[0, note(n)]], 0.24, 0.2, { at, send: 0.5 });
          tone("square", [[0, note(n + 12)]], 0.12, 0.03, { at });
        });
        noise(0.6, 0.06, { at: 0.7, type: "highpass", f0: 6000, attack: 0.05 });
      },
      ui() { tone("sine", [[0, 700], [0.06, 1000]], 0.07, 0.13); },
    };
  })();

  /* ---------- 파티클 ---------- */
  const fxCanvas = $("fx");
  const fctx = fxCanvas.getContext("2d");
  let particles = [];

  function resizeFx() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    fxCanvas.width = innerWidth * dpr; fxCanvas.height = innerHeight * dpr;
    fxCanvas.style.width = innerWidth + "px"; fxCanvas.style.height = innerHeight + "px";
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function spawn(p) {
    particles.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 0, age: 0, life: 0.6, size: 5, rot: 0, vr: 0, color: "#fff", kind: "chip" }, p));
  }

  // 돌 부스러기
  function chips(x, y, n, power = 1, colors = ["#3a444c", "#59646d", "#2a3238", "#8a949b"]) {
    for (let i = 0; i < n; i += 1) {
      const a = rand(-Math.PI * 0.95, -Math.PI * 0.05), s = rand(120, 360) * power;
      spawn({ kind: "chip", x: x + rand(-10, 10), y: y + rand(-6, 6), vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 1500, life: rand(0.4, 0.7), size: rand(2, 5), rot: rand(0, 6), vr: rand(-14, 14), color: pick(colors) });
    }
  }

  // 문양 색의 조각
  function shards(x, y, n, color, power = 1) {
    for (let i = 0; i < n; i += 1) {
      const a = (i / n) * Math.PI * 2 + rand(-0.3, 0.3), s = rand(160, 380) * power;
      spawn({ kind: "shard", x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, g: 600, drag: 2.4, life: rand(0.5, 0.85), size: rand(5, 9), rot: rand(0, 6), vr: rand(-10, 10), color });
    }
  }

  function sparks(x, y, n, color = "#fff6dc", speed = 1) {
    for (let i = 0; i < n; i += 1) {
      const a = rand(0, Math.PI * 2), s = rand(420, 820) * speed;
      spawn({ kind: "spark", x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, drag: 7, life: rand(0.14, 0.28), size: rand(1.5, 3), color });
    }
  }

  function ring(x, y, r, color = "#fff", life = 0.35, width = 5) { spawn({ kind: "ring", x, y, size: r, life, color, width }); }
  function ghost(x, y, glyph, color, size) { spawn({ kind: "ghost", x, y, vy: -60, drag: 1.5, life: 0.7, size, color, glyph }); }
  function beam(a, b, color) {
    spawn({ kind: "beam", x: a.x, y: a.y, x2: b.x, y2: b.y, life: 0.42, size: 6, color });
    for (let i = 0; i < 12; i += 1) {
      const t = Math.random();
      sparks(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, 1, color, 0.5);
    }
  }

  function confetti(x, y, n, spread = 1) {
    const colors = ["#ff7144", "#ffd27a", "#a6cd7c", "#75a9ff", "#c9a2ff", "#e8e7df"];
    for (let i = 0; i < n; i += 1) {
      const a = rand(-Math.PI * 0.85, -Math.PI * 0.15), s = rand(380, 900) * spread;
      spawn({ kind: "confetti", x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 900, drag: 1.6, life: rand(1.2, 2), size: rand(6, 11), rot: rand(0, 6), vr: rand(-14, 14), color: pick(colors), phase: rand(0, 6) });
    }
  }

  function updateParticles(dt) {
    fctx.clearRect(0, 0, innerWidth, innerHeight);
    if (!particles.length) return;
    particles = particles.filter((p) => (p.age += dt) < p.life);
    for (const p of particles) {
      const t = p.age / p.life;
      p.vx *= 1 - Math.min(1, p.drag * dt);
      p.vy = p.vy * (1 - Math.min(1, p.drag * dt)) + p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      fctx.save();
      fctx.translate(p.x, p.y);
      fctx.globalAlpha = p.kind === "confetti" ? Math.min(1, (1 - t) * 3) : 1 - t * t;
      fctx.fillStyle = p.color; fctx.strokeStyle = p.color;
      switch (p.kind) {
        case "chip":
          fctx.rotate(p.rot);
          fctx.beginPath(); fctx.moveTo(-p.size, -p.size * 0.4); fctx.lineTo(p.size * 0.6, -p.size * 0.7); fctx.lineTo(p.size * 0.8, p.size * 0.5); fctx.lineTo(-p.size * 0.3, p.size * 0.6); fctx.closePath(); fctx.fill();
          break;
        case "shard":
          fctx.rotate(p.rot); fctx.globalCompositeOperation = "lighter";
          fctx.beginPath(); fctx.moveTo(0, -p.size); fctx.lineTo(p.size * 0.45, p.size * 0.6); fctx.lineTo(-p.size * 0.45, p.size * 0.6); fctx.closePath(); fctx.fill();
          break;
        case "spark": {
          const len = Math.hypot(p.vx, p.vy) * 0.035;
          fctx.globalCompositeOperation = "lighter";
          fctx.rotate(Math.atan2(p.vy, p.vx)); fctx.lineWidth = p.size; fctx.lineCap = "round";
          fctx.beginPath(); fctx.moveTo(-len, 0); fctx.lineTo(0, 0); fctx.stroke();
          break;
        }
        case "ring": {
          const e = 1 - Math.pow(1 - t, 3);
          fctx.lineWidth = p.width * (1 - t); fctx.beginPath(); fctx.arc(0, 0, p.size * (0.3 + e), 0, Math.PI * 2); fctx.stroke();
          break;
        }
        case "ghost": {
          const e = 1 - Math.pow(1 - t, 2);
          fctx.globalAlpha = (1 - t) * 0.7; fctx.globalCompositeOperation = "lighter";
          fctx.font = `700 ${p.size * (1 + e * 0.8)}px ui-monospace, Consolas, monospace`;
          fctx.textAlign = "center"; fctx.textBaseline = "middle";
          fctx.shadowColor = p.color; fctx.shadowBlur = 18;
          fctx.fillText(p.glyph, 0, 0);
          break;
        }
        case "beam": {
          const dx = p.x2 - p.x, dy = p.y2 - p.y;
          fctx.globalCompositeOperation = "lighter"; fctx.lineCap = "round";
          // 빔은 가운데서 양 끝으로 뻗었다가 가늘어진다
          const grow = Math.min(1, t * 5), from = 0.5 - grow / 2, to = 0.5 + grow / 2;
          fctx.shadowColor = p.color; fctx.shadowBlur = 16;
          fctx.lineWidth = p.size * (1 - t);
          fctx.beginPath(); fctx.moveTo(dx * from, dy * from); fctx.lineTo(dx * to, dy * to); fctx.stroke();
          fctx.strokeStyle = "#fff"; fctx.lineWidth = p.size * 0.35 * (1 - t); fctx.stroke();
          break;
        }
        case "confetti":
          fctx.rotate(p.rot); fctx.scale(1, Math.abs(Math.sin(p.age * 9 + p.phase)) + 0.15);
          fctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
          break;
      }
      fctx.restore();
    }
  }

  /* ---------- 화면 흔들림 · 플래시 · 텍스트 ---------- */
  const wrap = $("wrap");
  let shake = 0;
  function addShake(amount) { shake = Math.min(18, shake + amount * (reduceMotion ? 0.25 : 1)); }
  function updateShake(dt) {
    if (shake > 0.05) {
      const a = shake;
      wrap.style.transform = `translate(${rand(-a, a)}px, ${rand(-a, a)}px) rotate(${rand(-a, a) * 0.06}deg)`;
      shake *= Math.pow(0.0008, dt);
    } else if (shake) {
      shake = 0; wrap.style.transform = "";
    }
  }

  function flashScreen(opacity, dur = 160, color = "#fff") {
    const el = $("flash");
    el.style.background = color;
    el.animate([{ opacity }, { opacity: 0 }], { duration: dur, easing: "ease-out" });
  }
  function vignette() { $("vignette").animate([{ opacity: 1 }, { opacity: 0 }], { duration: 420, easing: "ease-out" }); }

  function floatText(x, y, text, cls = "", delay = 0) {
    const el = document.createElement("div");
    el.className = "float " + cls;
    el.textContent = text;
    el.style.left = x + "px"; el.style.top = y + "px";
    $("floats").appendChild(el);
    const drift = rand(-16, 16);
    el.animate([
      { transform: "translate(-50%, -50%) scale(.3)", opacity: 0 },
      { transform: "translate(-50%, -90%) scale(1.3)", opacity: 1, offset: 0.18 },
      { transform: `translate(calc(-50% + ${drift * 0.5}px), -130%) scale(1)`, opacity: 1, offset: 0.6 },
      { transform: `translate(calc(-50% + ${drift}px), -220%) scale(.9)`, opacity: 0 },
    ], { duration: 850, delay, easing: "cubic-bezier(.2,.8,.3,1)", fill: "backwards" }).onfinish = () => el.remove();
  }

  function callout(html, { dur = 950, hold = 0.55, glow = "rgba(255,113,68,.8)", sub = "#ff7144" } = {}) {
    const el = document.createElement("div");
    el.className = "callout";
    el.innerHTML = html;
    el.style.setProperty("--glow", glow);
    el.style.setProperty("--glow-text", sub);
    document.body.appendChild(el);
    el.animate([
      { transform: "translate(-50%, -50%) scale(2.4)", opacity: 0, letterSpacing: ".6em" },
      { transform: "translate(-50%, -50%) scale(.94)", opacity: 1, letterSpacing: ".12em", offset: 0.15 },
      { transform: "translate(-50%, -50%) scale(1.04)", opacity: 1, offset: 0.25 },
      { transform: "translate(-50%, -50%) scale(1)", opacity: 1, offset: hold },
      { transform: "translate(-50%, -62%) scale(.96)", opacity: 0 },
    ], { duration: dur, easing: "ease-out" }).onfinish = () => el.remove();
  }

  function bump(el, scale = 1.4) {
    el.animate([{ transform: `scale(${scale}) rotate(-4deg)` }, { transform: "scale(.95)", offset: 0.6 }, { transform: "scale(1)" }], { duration: 280, easing: "ease-out" });
  }

  /* ---------- 보드 ---------- */
  let stage = 0, score = 0, shownScore = 0, combo = 0, tiles = [], open = [], locked = true, matched = 0, stageStart = 0, stageTime = 0, state = "ready";
  let run = { attempts: 0, matches: 0, bestCombo: 0, time: 0 };
  let stageStats = { attempts: 0, bestCombo: 0 };
  let flowId = 0, overlayReadyAt = 0, cols = 4, rows = 3;
  let best = readBest();
  ui.best.textContent = best;

  function readBest() { try { return Number(localStorage.getItem("stone-pairs-best")) || 0; } catch { return 0; } }
  function saveBest() { try { localStorage.setItem("stone-pairs-best", String(best)); } catch { /* storage unavailable */ } }

  function shuffle(items) {
    for (let i = items.length - 1; i > 0; i -= 1) { const j = Math.floor(Math.random() * (i + 1)); [items[i], items[j]] = [items[j], items[i]]; }
    return items;
  }

  function layout() {
    const gap = 8;
    const size = Math.max(36, Math.floor(Math.min((innerWidth - 44 - gap * (cols - 1)) / cols, (innerHeight - 110 - gap * (rows - 1)) / rows, 96)));
    boardEl.style.setProperty("--size", `${size}px`);
    boardEl.style.setProperty("--gap", `${gap}px`);
    boardEl.style.gridTemplateColumns = `repeat(${cols}, var(--size))`;
    document.documentElement.style.setProperty("--board-w", `${size * cols + gap * (cols - 1)}px`);
  }

  function center(tile) {
    const r = tile.el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width };
  }

  // 왼쪽 위에서 오른쪽 아래로 대각선 물결
  async function wave(stepMs, fn, id) {
    for (let k = 0; k < cols + rows - 1; k += 1) {
      if (id !== flowId) return false;
      fn(tiles.filter((t) => t.r + t.c === k), k);
      await wait(stepMs);
    }
    return id === flowId;
  }

  function setHeat() {
    document.documentElement.style.setProperty("--heat", Math.min(1, combo / 8).toFixed(2));
  }

  function buildStage() {
    [cols, rows] = STAGES[Math.min(stage, STAGES.length - 1)];
    const pairs = (cols * rows) / 2;
    const picks = shuffle([...SYMBOLS]).slice(0, pairs);
    const deck = shuffle([...picks, ...picks]);
    layout();
    boardEl.innerHTML = "";
    boardEl.classList.remove("live");
    tiles = deck.map(([glyph, color], index) => {
      const button = document.createElement("button");
      button.className = "tile";
      button.type = "button";
      button.style.setProperty("--c", color);
      button.setAttribute("aria-label", "뒤집힌 돌판");
      // U+FE0E: 이모지 대신 글자 모양으로 그린다
      button.innerHTML = `<div class="shadow"></div><div class="lift"><div class="inner"><div class="face back"></div><div class="face front"><span>${glyph}︎</span></div></div></div>`;
      const tile = { glyph, color, el: button, lift: button.querySelector(".lift"), done: false, r: Math.floor(index / cols), c: index % cols };
      button.addEventListener("click", () => flip(index));
      if (finePointer) {
        button.addEventListener("pointerenter", () => { if (canFlip(tile)) sfx.hover(); });
        button.addEventListener("pointermove", (e) => tilt(tile, e));
        button.addEventListener("pointerleave", () => tilt(tile, null));
      }
      boardEl.appendChild(button);
      return tile;
    });
    open = []; matched = 0; locked = true; stageStart = 0; stageTime = 0;
    stageStats = { attempts: 0, bestCombo: 0 };
    ui.stage.textContent = stage + 1;
    ui.time.textContent = 0;
    renderProgress();
    bump(ui.stage, 1.6);
    introStage(++flowId);
  }

  // 판 깔기 → 전부 보여주기 → 기억 시간 → 다시 덮기 → 시작
  async function introStage(id) {
    if (!(await wave(45, (row, k) => {
      for (const t of row) {
        t.lift.animate([
          { transform: "translateY(-50px) scale(.5) rotate(-10deg)", opacity: 0 },
          { transform: "translateY(4px) scale(1.05) rotate(1deg)", opacity: 1, offset: 0.7 },
          { transform: "none", opacity: 1 },
        ], { duration: 380, easing: "cubic-bezier(.2,.8,.3,1)", fill: "backwards" });
      }
      sfx.deal(k);
    }, id))) return;
    await wait(380);
    if (!(await wave(55, (row, k) => { row.forEach((t) => t.el.classList.add("open")); sfx.reveal(k); }, id))) return;
    await wait(350);
    if (id !== flowId) return;
    ui.memo.animate([{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }], { duration: PREVIEW_MS, easing: "linear" });
    for (let i = 1; i < 4; i += 1) setTimeout(() => { if (id === flowId) sfx.memoTick(); }, (PREVIEW_MS / 4) * i);
    await wait(PREVIEW_MS);
    if (!(await wave(40, (row, k) => { row.forEach((t) => t.el.classList.remove("open")); sfx.conceal(k); }, id))) return;
    await wait(220);
    if (id !== flowId) return;
    sfx.go();
    callout("GO", { dur: 650, hold: 0.4, glow: "rgba(117,169,255,.8)" });
    locked = false;
    boardEl.classList.add("live");
    stageStart = performance.now();
  }

  function canFlip(tile) { return state === "play" && !locked && !tile.done && !tile.el.classList.contains("open"); }

  function tilt(tile, e) {
    if (reduceMotion) return;
    if (!e || !canFlip(tile)) {
      tile.lift.style.removeProperty("--rx"); tile.lift.style.removeProperty("--ry"); tile.el.style.removeProperty("--sheen");
      return;
    }
    const r = tile.el.getBoundingClientRect();
    const dx = (e.clientX - r.left) / r.width - 0.5, dy = (e.clientY - r.top) / r.height - 0.5;
    tile.lift.style.setProperty("--rx", `${(-dy * 16).toFixed(1)}deg`);
    tile.lift.style.setProperty("--ry", `${(dx * 16).toFixed(1)}deg`);
    tile.el.style.setProperty("--sheen", `${(50 - dx * 120).toFixed(0)}%`);
  }

  function punch(tile, from = 0.9, over = 1.06, dur = 260) {
    tile.lift.animate([{ transform: `scale(${from})` }, { transform: `scale(${over})`, offset: 0.5 }, { transform: "scale(1)" }], { duration: dur, easing: "ease-out" });
  }

  function flip(index) {
    const tile = tiles[index];
    if (!canFlip(tile)) return;
    sfx.init();
    tilt(tile, null);
    tile.el.classList.add("open");
    tile.el.setAttribute("aria-label", tile.glyph);
    open.push(index);
    sfx.flip(open.length === 2);
    punch(tile);
    const p = center(tile);
    chips(p.x, p.y + p.w * 0.3, 5, 0.6);
    if (open.length < 2) return;

    const [a, b] = open.map((i) => tiles[i]);
    open = [];
    run.attempts += 1; stageStats.attempts += 1;
    if (a.glyph === b.glyph) {
      combo += 1;
      const gain = 20 + combo * 10;
      score += gain;
      a.done = b.done = true;
      matched += 1;
      run.matches += 1;
      run.bestCombo = Math.max(run.bestCombo, combo);
      stageStats.bestCombo = Math.max(stageStats.bestCombo, combo);
      const last = matched === tiles.length / 2;
      if (last) locked = true;
      // 두 번째 장이 다 뒤집힌 뒤에 터뜨린다
      const id = flowId;
      setTimeout(() => { if (id === flowId) celebrate(a, b, gain, last); }, 200);
    } else {
      const broke = combo;
      combo = 0;
      locked = true;
      const id = flowId;
      setTimeout(() => { if (id === flowId) reject(a, b, broke); }, 230);
      setTimeout(() => {
        if (id !== flowId) return;
        for (const t of [a, b]) { t.el.classList.remove("open", "miss"); t.el.setAttribute("aria-label", "뒤집힌 돌판"); }
        sfx.unflip();
        locked = false;
      }, 820);
    }
  }

  function celebrate(a, b, gain, last) {
    const pa = center(a), pb = center(b);
    const mid = { x: (pa.x + pb.x) / 2, y: (pa.y + pb.y) / 2 };
    const heat = Math.min(1, combo / 8);
    for (const [t, p] of [[a, pa], [b, pb]]) {
      t.el.classList.add("done");
      t.lift.animate([
        { transform: "scale(1)" }, { transform: "scale(1.22) rotate(-3deg)", offset: 0.3 }, { transform: "scale(.88)", offset: 0.65 }, { transform: "scale(.92)" },
      ], { duration: 420, easing: "ease-out" });
      shards(p.x, p.y, 8 + Math.round(heat * 6), t.color, 1 + heat * 0.4);
      sparks(p.x, p.y, 8);
      ring(p.x, p.y, p.w * 0.7, t.color, 0.38, 5);
      ghost(p.x, p.y, t.glyph, t.color, p.w * 0.44);
    }
    beam(pa, pb, a.color);
    if (heat > 0.3) ring(mid.x, mid.y, 80 + heat * 60, "#ffd27a", 0.45, 3);
    floatText(mid.x, mid.y, `+${gain}`, "gain");
    if (combo >= 2) floatText(mid.x, mid.y + 26, `COMBO ×${combo}`, "combo", 80);
    sfx.match(combo);
    addShake(2 + heat * 5);
    flashScreen(0.05 + heat * 0.08, 140);
    bump(ui.combo, 1.3 + heat * 0.4);
    bump(ui.score, 1.25);
    ui.combo.textContent = combo;
    setHeat();
    renderProgress();
    const word = COMBO_CALLOUTS[combo];
    if (word && !last) {
      setTimeout(() => {
        callout(`${word}<small>COMBO ×${combo}</small>`);
        sfx.comboUp(combo);
        flashScreen(0.18, 220, "#ffd27a");
        confetti(innerWidth / 2, innerHeight * 0.5, 24 + combo * 2, 0.8);
      }, 120);
    }
    if (last) setTimeout(() => finishStage(flowId), 420);
  }

  function reject(a, b, broke) {
    for (const t of [a, b]) {
      t.el.classList.add("miss");
      t.lift.animate([
        { transform: "translateX(0)" }, { transform: "translateX(-7px) rotate(-3deg)" }, { transform: "translateX(6px) rotate(2deg)" },
        { transform: "translateX(-4px) rotate(-1deg)" }, { transform: "translateX(2px)" }, { transform: "translateX(0)" },
      ], { duration: 360, easing: "ease-out" });
      const p = center(t);
      chips(p.x, p.y + p.w * 0.3, 6, 0.8, ["#5a2c22", "#ff7144", "#3a444c"]);
    }
    sfx.miss();
    addShake(5);
    vignette();
    if (broke >= 2) {
      const pa = center(a), pb = center(b);
      sfx.comboBreak();
      floatText((pa.x + pb.x) / 2, (pa.y + pb.y) / 2, `COMBO BREAK ×${broke}`, "bad");
      ui.combo.animate([{ transform: "translateX(-5px)", color: "#ff3b2f" }, { transform: "translateX(5px)" }, { transform: "translateX(0)" }], { duration: 260 });
    }
    ui.combo.textContent = 0;
    setHeat();
  }

  function renderProgress() {
    ui.fill.style.width = `${tiles.length ? (matched / (tiles.length / 2)) * 100 : 0}%`;
  }

  async function finishStage(id) {
    if (id !== flowId) return;
    stageTime = (performance.now() - stageStart) / 1000;
    stageStart = 0;
    run.time += stageTime;
    boardEl.classList.remove("live");
    const timeBonus = Math.max(0, Math.round((tiles.length * 4 - stageTime) * 5));
    const final = stage + 1 >= STAGES.length;

    sfx.stageClear();
    flashScreen(0.3, 260);
    addShake(8);
    callout(final ? "ALL CLEAR<small>EVERY STONE MATCHED</small>" : `STAGE ${stage + 1}<small>CLEAR</small>`, { dur: 1300, hold: 0.7, glow: "rgba(255,210,122,.85)", sub: "#ffd27a" });
    if (!(await wave(55, (row, k) => {
      for (const t of row) {
        t.lift.animate([{ transform: "scale(.92)" }, { transform: "scale(1.14) translateY(-6px)", offset: 0.4 }, { transform: "scale(.92)" }], { duration: 360, easing: "ease-out" });
        const p = center(t);
        sparks(p.x, p.y, 4, t.color, 0.6);
      }
      sfx.sparkle(k);
    }, id))) return;
    confetti(innerWidth / 2, innerHeight * 0.62, final ? 120 : 60, final ? 1.2 : 0.9);
    await wait(650);
    if (id !== flowId) return;

    const before = score;
    score += timeBonus;
    stage += 1;
    const newBest = score > best;
    if (newBest) { best = score; saveBest(); }
    combo = 0; setHeat(); ui.combo.textContent = 0;

    if (final) {
      state = "over";
      if (newBest) sfx.fanfare();
      showCard("All stages clear", "다섯 판을 모두 맞혔어요.", [
        ["Total time", `${run.time.toFixed(1)}s`],
        ["Accuracy", `${Math.round((run.matches / Math.max(1, run.attempts)) * 100)}%`],
        ["Best combo", `×${run.bestCombo}`, run.bestCombo >= 5],
        ["Time bonus", `+${timeBonus}`, false, "bonus"],
      ], before, newBest, "SPACE 또는 터치로 다시 시작");
      return;
    }
    state = "between";
    showCard(`Stage ${stage} clear`, `다음은 ${STAGES[stage][0]}×${STAGES[stage][1]} 판`, [
      ["Time", `${stageTime.toFixed(1)}s`],
      ["Tries", `${stageStats.attempts} / ${tiles.length / 2}`, stageStats.attempts === tiles.length / 2],
      ["Best combo", `×${stageStats.bestCombo}`, stageStats.bestCombo >= 5],
      ["Time bonus", `+${timeBonus}`, false, "bonus"],
    ], before, newBest, "SPACE 또는 터치로 계속");
  }

  // 결과 카드: 시간 보너스를 점수에 더하며 카운트업
  function showCard(title, message, rows, scoreBefore, newBest, prompt) {
    ui.title.textContent = title;
    ui.message.textContent = message;
    ui.prompt.textContent = prompt;
    ui.demo.hidden = true;
    ui.stats.innerHTML = rows.map(([k, v, hi, id]) => `<dt>${k}</dt><dd class="${hi ? "hi" : ""}"${id ? ` id="${id}"` : ""}>${v}</dd>`).join("")
      + `<div class="total"><dt>Score</dt><b id="total">${scoreBefore}</b></div>`
      + (newBest ? `<dd class="newbest" style="grid-column:1/-1;text-align:center">NEW BEST</dd>` : "");
    overlay.hidden = false;
    overlayReadyAt = performance.now() + 600;
    ui.card.animate([
      { transform: "translateY(24px) scale(.9)", opacity: 0 }, { transform: "translateY(-4px) scale(1.02)", opacity: 1, offset: 0.6 }, { transform: "none", opacity: 1 },
    ], { duration: 420, easing: "cubic-bezier(.2,.8,.3,1)" });
    const total = $("total"), gain = score - scoreBefore;
    if (gain <= 0) return;
    const id = flowId, steps = Math.min(30, gain), t0 = performance.now() + 380, dur = 700;
    let ticked = 0;
    (function count(now) {
      if (id !== flowId || overlay.hidden) return;
      const k = Math.max(0, Math.min(1, (now - t0) / dur));
      total.textContent = Math.round(scoreBefore + gain * (1 - Math.pow(1 - k, 2)));
      const n = Math.floor(k * steps);
      while (ticked < n) sfx.countUp(ticked++);
      if (k < 1) requestAnimationFrame(count);
      else { bump(total, 1.5); sfx.ui(); }
    })(performance.now());
  }

  function renderScore(dt) {
    if (shownScore !== score) {
      shownScore += (score - shownScore) * Math.min(1, dt * 12);
      if (Math.abs(score - shownScore) < 0.5) shownScore = score;
      ui.score.textContent = Math.round(shownScore);
    }
    if (best > Number(ui.best.textContent)) { ui.best.textContent = best; bump(ui.best, 1.5); }
  }

  function start() {
    if (state === "play" || performance.now() < overlayReadyAt) return;
    sfx.init();
    sfx.ui();
    if (state !== "between") {
      stage = 0; score = 0; shownScore = 0; ui.score.textContent = 0;
      run = { attempts: 0, matches: 0, bestCombo: 0, time: 0 };
    }
    combo = 0; setHeat(); ui.combo.textContent = 0;
    state = "play";
    overlay.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, fill: "forwards" });
    setTimeout(() => { if (state === "play") { overlay.hidden = true; overlay.getAnimations().forEach((a) => a.cancel()); } }, 180);
    buildStage();
  }

  /* ---------- 루프 ---------- */
  let lastFrame = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    updateParticles(dt);
    updateShake(dt);
    renderScore(dt);
    if (stageStart && state === "play") {
      const s = Math.floor((now - stageStart) / 1000);
      if (String(s) !== ui.time.textContent) ui.time.textContent = s;
    }
    requestAnimationFrame(frame);
  }

  const muteBtn = $("mute");
  muteBtn.classList.toggle("muted", sfx.muted);
  muteBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
  muteBtn.addEventListener("click", () => { sfx.init(); muteBtn.classList.toggle("muted", sfx.toggleMute()); sfx.ui(); });

  overlay.addEventListener("pointerdown", () => start());
  addEventListener("keydown", (event) => { if ((event.code === "Space" || event.code === "Enter") && state !== "play") { event.preventDefault(); start(); } });
  addEventListener("resize", () => { layout(); resizeFx(); });

  resizeFx();
  layout();
  requestAnimationFrame(frame);
</script>
</body>
</html>
